services:
  web:
    image: ghcr.io/watch-jalwa/jalwa-platform-web:${JALWA_IMAGE_TAG:?JALWA_IMAGE_TAG must be an immutable Git SHA}
    restart: unless-stopped
    init: true
    env_file: .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/web/.next/cache:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa, supabase]

  worker:
    image: ghcr.io/watch-jalwa/jalwa-platform-worker:${JALWA_IMAGE_TAG:?JALWA_IMAGE_TAG must be an immutable Git SHA}
    restart: unless-stopped
    init: true
    env_file: .env.production
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p=process.env.WORKER_HEARTBEAT_PATH||'/tmp/jalwa-worker-heartbeat';if(Date.now()-fs.statSync(p).mtimeMs>120000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 3g
    cpus: 2.0
    stop_grace_period: 2m
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa, supabase]

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    init: true
    env_file: .env.production
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa, supabase]

networks:
  jalwa:
  supabase:
    external: true
    name: supabase_default

volumes:
  caddy_data:
  caddy_config:
