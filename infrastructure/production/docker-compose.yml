services:
  postgres:
    image: postgres:17-alpine
    container_name: jalwa-postgres
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 60s
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa]

  web:
    image: ${JALWA_WEB_IMAGE:-ghcr.io/watch-jalwa/jalwa-platform-web:latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: true
      - path: .env.media
        required: false
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/web/.next/cache:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa]

  worker:
    image: ${JALWA_WORKER_IMAGE:-ghcr.io/watch-jalwa/jalwa-platform-worker:latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: true
      - path: .env.media
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p=process.env.WORKER_HEARTBEAT_PATH||'/tmp/jalwa-worker-heartbeat';if(Date.now()-fs.statSync(p).mtimeMs>120000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 3g
    cpus: 2.0
    stop_grace_period: 2m
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    env_file: .env.production
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa]

networks:
  jalwa:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
