services:
  web:
    image: ghcr.io/watch-jalwa/jalwa-platform-web:${JALWA_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/web/.next/cache:size=256m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 1.5
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa, supabase]

  worker:
    image: ghcr.io/watch-jalwa/jalwa-platform-worker:${JALWA_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g
    cpus: 2.0
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa, supabase]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    networks: [jalwa, supabase]

networks:
  jalwa:
  supabase:
    external: true
    name: supabase_default

volumes:
  caddy_data:
  caddy_config:
