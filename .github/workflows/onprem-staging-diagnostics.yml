name: Diagnose on-prem staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jalwa-onprem-staging-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate on-prem access configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in HOST USER APP_DIR KNOWN_HOSTS SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing staging access value $name" >&2; exit 1; }
          done
          test "$USER" = codistan
          test "$APP_DIR" = /opt/codistan/jalwa-platform
          grep -Fq "$HOST" <<<"$KNOWN_HOSTS" || { echo 'Pinned SSH host key does not contain the staging host.' >&2; exit 1; }

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Collect read-only staging diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "cd '$APP_DIR' && COMPOSE_PROJECT_NAME=jalwa-platform COMPOSE_FILE='$APP_DIR/docker-compose.yml:$APP_DIR/docker-compose.codistan-staging.yml' JALWA_ENV_FILE='$APP_DIR/.env.staging' DB_CONTAINER=jalwa-postgres-staging bash -s" \
            < infrastructure/production/scripts/collect-staging-diagnostics.sh
