name: Cleanup merged branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete safely merged branches
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Delete branches fully merged into main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted=()
          skipped=()
          owner="${GITHUB_REPOSITORY%%/*}"

          mapfile -t merged_branches < <(
            git branch --remotes --merged origin/main --format='%(refname:short)' \
              | sed 's#^origin/##' \
              | grep -v '^HEAD$' \
              | sort -u
          )

          for branch in "${merged_branches[@]}"; do
            case "$branch" in
              main|master|develop|development|staging|production|release/*|hotfix/*|backup/*)
                skipped+=("$branch (retained by policy)")
                continue
                ;;
            esac

            encoded_branch="$(python3 - "$branch" <<'PY'
          import sys
          import urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
            )"

            open_pr_count="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}%3A${encoded_branch}&per_page=1" \
                | jq 'length'
            )"

            if [[ "$open_pr_count" != "0" ]]; then
              skipped+=("$branch (open pull request)")
              continue
            fi

            curl --fail --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"

            deleted+=("$branch")
          done

          {
            echo '## Merged branch cleanup'
            echo
            echo "Deleted branches: ${#deleted[@]}"
            if (( ${#deleted[@]} > 0 )); then
              printf -- '- `%s`\n' "${deleted[@]}"
            fi
            echo
            echo "Retained branches: ${#skipped[@]}"
            if (( ${#skipped[@]} > 0 )); then
              printf -- '- %s\n' "${skipped[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
