name: Public-domain live activation contract

on:
  pull_request:
    paths:
      - ".github/workflows/set-public-domain-live-sources.yml"
      - ".github/workflows/public-domain-live-activation-contract.yml"
      - "infrastructure/production/scripts/set-public-domain-live-sources.sh"
      - "scripts/set-public-domain-live-catalogue-state.sql"
      - "scripts/seed-public-domain-live-sources.sql"
      - "scripts/test-public-domain-live-activation.sh"
      - "scripts/test-public-domain-live-rights-readiness.sh"
      - "scripts/test-institutional-live-readiness.sh"
      - "supabase/migrations/202608010002_approved_public_domain_live_inventory.sql"
      - "supabase/migrations/202608010003_institutional_public_affairs_live_sources.sql"
      - "apps/web/lib/live-sources/**"
      - "apps/web/components/official-live-link-player.tsx"
      - "apps/web/app/live/page.tsx"
      - "apps/web/app/watch/[slug]/page.tsx"
      - "scripts/public-domain-live-acceptance.mjs"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - ".github/workflows/set-public-domain-live-sources.yml"
      - ".github/workflows/public-domain-live-activation-contract.yml"
      - "infrastructure/production/scripts/set-public-domain-live-sources.sh"
      - "scripts/set-public-domain-live-catalogue-state.sql"
      - "scripts/seed-public-domain-live-sources.sql"
      - "scripts/test-public-domain-live-activation.sh"
      - "scripts/test-public-domain-live-rights-readiness.sh"
      - "scripts/test-institutional-live-readiness.sh"
      - "supabase/migrations/202608010002_approved_public_domain_live_inventory.sql"
      - "supabase/migrations/202608010003_institutional_public_affairs_live_sources.sql"
      - "apps/web/lib/live-sources/**"
      - "apps/web/components/official-live-link-player.tsx"
      - "apps/web/app/live/page.tsx"
      - "apps/web/app/watch/[slug]/page.tsx"
      - "scripts/public-domain-live-acceptance.mjs"

permissions:
  contents: read

concurrency:
  group: public-domain-live-activation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate activation scripts
        run: |
          bash -n infrastructure/production/scripts/set-public-domain-live-sources.sh
          bash -n scripts/test-public-domain-live-activation.sh
          bash -n scripts/test-public-domain-live-rights-readiness.sh
          bash -n scripts/test-institutional-live-readiness.sh
      - name: Run fail-closed activation contract
        run: bash scripts/test-public-domain-live-activation.sh
      - name: Run approved rights readiness contract
        run: bash scripts/test-public-domain-live-rights-readiness.sh
      - name: Run institutional live readiness contract
        run: bash scripts/test-institutional-live-readiness.sh
