name: Finalize production workflow

on:
  push:
    branches:
      - agent/production-lifecycle-hardening
    paths:
      - .github/workflows/finalize-production-workflow.yml

permissions:
  contents: write

concurrency:
  group: jalwa-production-workflow-finalization
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/production-lifecycle-hardening
      - name: Pin actions and wire final host acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-production.yml')
          text = path.read_text()
          replacements = {
              'docker/setup-buildx-action@v4': 'docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c',
              'docker/login-action@v4': 'docker/login-action@dbcb813823bdd20940b903addbd779551569679f',
              'docker/build-push-action@v6': 'docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a',
              'cloudflare/wrangler-action@v3': 'cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'Expected action reference not found: {old}')
              text = text.replace(old, new)
          build_marker = '          push: true\n          tags:'
          if text.count(build_marker) != 2:
              raise SystemExit('Expected exactly two image push blocks.')
          text = text.replace(build_marker, '          push: true\n          provenance: mode=max\n          sbom: true\n          tags:')
          final_command = '          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/run-account-requests.sh"'
          if text.count(final_command) != 1:
              raise SystemExit('Expected final account-request command exactly once.')
          text = text.replace(final_command, final_command + '\n          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/restore-drill.sh"\n          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/host-acceptance.sh \'https://$DOMAIN\' \'https://api.$DOMAIN\'"')
          path.write_text(text)
          PY
      - name: Verify immutable references and final acceptance
        run: |
          set -euo pipefail
          ! grep -E 'uses: (docker|cloudflare)/[^@]+@v[0-9]+' .github/workflows/deploy-production.yml
          grep -q 'provenance: mode=max' .github/workflows/deploy-production.yml
          grep -q 'sbom: true' .github/workflows/deploy-production.yml
          grep -q 'restore-drill.sh' .github/workflows/deploy-production.yml
          grep -q 'host-acceptance.sh' .github/workflows/deploy-production.yml
      - name: Commit finalized deployment workflow
        run: |
          set -euo pipefail
          git add .github/workflows/deploy-production.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Pin deployment actions and enforce host acceptance'
          git push origin HEAD:agent/production-lifecycle-hardening
