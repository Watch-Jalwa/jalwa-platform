name: Staging live-test 50 rights and wave1 publish

on:
  workflow_dispatch:
  push:
    branches: ["fix/staging-certification-blockers"]
    paths:
      - "scripts/staging-approve-live-test-50-rights.sql"
      - "scripts/staging-ingest-live-test-wave1.mjs"
      - "scripts/staging-ingest-live-test-wave2.mjs"
      - ".github/workflows/staging-live-test-50-rights-publish.yml"

permissions:
  contents: read

jobs:
  rights-and-wave1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      DOMAIN: ${{ vars.STAGING_DOMAIN || 'jalwa-platform.codistan.org' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure pinned staging SSH identity
        run: |
          set -euo pipefail
          test "$USER" = codistan
          test "$APP_DIR" = /opt/codistan/jalwa-platform
          test -n "$HOST" && test -n "$KNOWN_HOSTS" && test -n "$SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Approve clear open-licence rights on staging
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker exec -i jalwa-postgres-staging sh -lc 'psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\"'" \
            < scripts/staging-approve-live-test-50-rights.sql | tee /tmp/rights-approve.out
          grep -E '"approved_rights"' /tmp/rights-approve.out

      - name: Stage wave1 ingest script and Commons media on host
        run: |
          set -euo pipefail
          remote_dir="$APP_DIR/candidate-db/$GITHUB_SHA/live-test-wave1"
          media_local="/tmp/wave1-media"
          install -d -m 700 "$media_local"
          files=(
            'Mossy_Tree_CC0.webm'
            'Baking_cookies.ogv'
            'Ocean_surface_waves.ogv'
            'Tiny_Water_Fall-HD.ogv'
            'Tree_trimmer.webm'
            'Counting_from_1_to_20_in_Chisenbop.webm'
            'Vanellus_vanellus.ogv'
          )
          # Staging host cannot reach Commons (TLS reset). Download on the runner, then scp.
          for file in "${files[@]}"; do
            curl -fsSL --retry 5 --retry-delay 3 \
              -A 'JalwaStagingIngest/1.0 (GitHub Actions; staging live-test)' \
              -o "$media_local/$file" \
              "https://commons.wikimedia.org/wiki/Special:FilePath/${file}"
            test -s "$media_local/$file"
            ls -lh "$media_local/$file"
          done
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "install -d -m 700 '$remote_dir' '$remote_dir/media'"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa \
            scripts/staging-ingest-live-test-wave1.mjs \
            "$USER@$HOST:$remote_dir/staging-ingest-live-test-wave1.mjs"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa \
            "$media_local"/* \
            "$USER@$HOST:$remote_dir/media/"

      - name: Ingest and publish wave1 self-host shorts
        run: |
          set -euo pipefail
          remote_dir="$APP_DIR/candidate-db/$GITHUB_SHA/live-test-wave1"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "REMOTE_DIR='$remote_dir' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          media_dir="$REMOTE_DIR/media"
          for file in \
            Mossy_Tree_CC0.webm \
            Baking_cookies.ogv \
            Ocean_surface_waves.ogv \
            Tiny_Water_Fall-HD.ogv \
            Tree_trimmer.webm \
            Counting_from_1_to_20_in_Chisenbop.webm \
            Vanellus_vanellus.ogv
          do
            test -s "$media_dir/$file"
          done
          set -a
          while IFS= read -r line; do
            case "$line" in
              DATABASE_URL=*|R2_ACCOUNT_ID=*|R2_ACCESS_KEY_ID=*|R2_SECRET_ACCESS_KEY=*|R2_BUCKET=*|R2_INCOMING_BUCKET=*|R2_PROCESSED_BUCKET=*|R2_ENDPOINT=*)
                export "$line"
                ;;
            esac
          done < "$APP_DIR/.env.staging"
          set +a
          test -n "${DATABASE_URL:-}"
          test -n "${R2_ACCOUNT_ID:-}"
          pg_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' jalwa-postgres-staging | awk 'NF{print; exit}')"
          test -n "$pg_ip"
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed -E "s#(@)([^/@]+)(:[0-9]+/)#@${pg_ip}\\3#")"
          export DATABASE_URL
          docker run --rm \
            --network host \
            -e DATABASE_URL \
            -e R2_ACCOUNT_ID \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_BUCKET \
            -e R2_INCOMING_BUCKET \
            -e R2_PROCESSED_BUCKET \
            -e R2_ENDPOINT \
            -e WAVE1_MEDIA_DIR=/media \
            -e WAVE1_WAIT_MS=900000 \
            -v "$REMOTE_DIR/staging-ingest-live-test-wave1.mjs:/opt/jalwa-ingest/staging-ingest-live-test-wave1.mjs:ro" \
            -v "$media_dir:/media:ro" \
            -w /tmp/jalwa-ingest \
            node:22-bookworm-slim \
            bash -lc 'mkdir -p /tmp/jalwa-ingest && cd /tmp/jalwa-ingest && cp /opt/jalwa-ingest/staging-ingest-live-test-wave1.mjs . && printf "%s\n" "{\"name\":\"jalwa-wave1\",\"type\":\"module\"}" > package.json && npm install --no-audit --no-fund pg@8.16.3 @aws-sdk/client-s3@3.758.0 >/tmp/npm.log 2>&1 && node ./staging-ingest-live-test-wave1.mjs' \
            | tee /tmp/wave1-ingest.out
          REMOTE
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST:/tmp/wave1-ingest.out" /tmp/wave1-ingest.out || true
          test -s /tmp/wave1-ingest.out
          grep -E '"published"' /tmp/wave1-ingest.out || true

      - name: Stage wave2 ingest script and media on host
        run: |
          set -euo pipefail
          remote_dir="$APP_DIR/candidate-db/$GITHUB_SHA/live-test-wave2"
          media_local="/tmp/wave2-media"
          install -d -m 700 "$media_local"
          python3 - <<'PY'
          import pathlib, urllib.parse, urllib.request
          out = pathlib.Path("/tmp/wave2-media")
          ua = "JalwaStagingIngest/1.0 (GitHub Actions; staging live-test wave2)"
          commons = [
            "FREE_real_VHS_static.webm",
            "Wie_entstehen_Fossilien_(CC_by_4.0).webm",
            "A_fly-through_of_the_Proxima_Centauri_system_(video).webm",
            "Upbeat_huamei_bird_calling.oga",
            "Joseph_Sardin_-_Passer_domesticus_tschilp_call.oga",
            "Abrasive_sounding_bird_debate.oga",
            "ESOcast_254_Light.webm",
            "ESOcast_265_Light.webm",
          ]
          direct = [
            ("bbb_sunflower_720p_30fps_normal.mp4", "https://download.blender.org/demo/movies/BBB/bbb_sunflower_720p_30fps_normal.mp4"),
          ]
          failed = []
          for name in commons:
            dest = out / name
            if dest.exists() and dest.stat().st_size > 0:
              print(f"skip existing {name}")
              continue
            url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + urllib.parse.quote(name)
            print(f"fetch {name}")
            try:
              req = urllib.request.Request(url, headers={"User-Agent": ua})
              with urllib.request.urlopen(req, timeout=600) as resp, open(dest, "wb") as fh:
                while True:
                  chunk = resp.read(1024 * 1024)
                  if not chunk:
                    break
                  fh.write(chunk)
              assert dest.stat().st_size > 0, name
              print(f"ok {name} {dest.stat().st_size}")
            except Exception as exc:
              failed.append(name)
              if dest.exists():
                dest.unlink()
              print(f"WARN {name}: {exc}")
          for name, url in direct:
            dest = out / name
            if dest.exists() and dest.stat().st_size > 0:
              print(f"skip existing {name}")
              continue
            print(f"fetch {name}")
            req = urllib.request.Request(url, headers={"User-Agent": ua})
            with urllib.request.urlopen(req, timeout=1200) as resp, open(dest, "wb") as fh:
              while True:
                chunk = resp.read(1024 * 1024)
                if not chunk:
                  break
                fh.write(chunk)
            assert dest.stat().st_size > 0, name
            print(f"ok {name} {dest.stat().st_size}")
          required = [
            "FREE_real_VHS_static.webm",
            "Upbeat_huamei_bird_calling.oga",
            "Joseph_Sardin_-_Passer_domesticus_tschilp_call.oga",
            "Abrasive_sounding_bird_debate.oga",
            "bbb_sunflower_720p_30fps_normal.mp4",
          ]
          missing = [n for n in required if not (out / n).exists() or (out / n).stat().st_size == 0]
          if missing:
            raise SystemExit(f"required wave2 media missing: {missing}; optional failed={failed}")
          print(f"optional_failed={failed}")
          PY
          ls -lh "$media_local"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "install -d -m 700 '$remote_dir' '$remote_dir/media'"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa \
            scripts/staging-ingest-live-test-wave2.mjs \
            "$USER@$HOST:$remote_dir/staging-ingest-live-test-wave2.mjs"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa \
            "$media_local"/* \
            "$USER@$HOST:$remote_dir/media/"

      - name: Ingest and publish wave2 self-host items
        run: |
          set -euo pipefail
          remote_dir="$APP_DIR/candidate-db/$GITHUB_SHA/live-test-wave2"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "REMOTE_DIR='$remote_dir' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          media_dir="$REMOTE_DIR/media"
          test -s "$media_dir/FREE_real_VHS_static.webm"
          test -s "$media_dir/bbb_sunflower_720p_30fps_normal.mp4"
          set -a
          while IFS= read -r line; do
            case "$line" in
              DATABASE_URL=*|R2_ACCOUNT_ID=*|R2_ACCESS_KEY_ID=*|R2_SECRET_ACCESS_KEY=*|R2_BUCKET=*|R2_INCOMING_BUCKET=*|R2_PROCESSED_BUCKET=*|R2_ENDPOINT=*)
                export "$line"
                ;;
            esac
          done < "$APP_DIR/.env.staging"
          set +a
          test -n "${DATABASE_URL:-}"
          test -n "${R2_ACCOUNT_ID:-}"
          pg_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' jalwa-postgres-staging | awk 'NF{print; exit}')"
          test -n "$pg_ip"
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed -E "s#(@)([^/@]+)(:[0-9]+/)#@${pg_ip}\\3#")"
          export DATABASE_URL
          docker run --rm \
            --network host \
            -e DATABASE_URL \
            -e R2_ACCOUNT_ID \
            -e R2_ACCESS_KEY_ID \
            -e R2_SECRET_ACCESS_KEY \
            -e R2_BUCKET \
            -e R2_INCOMING_BUCKET \
            -e R2_PROCESSED_BUCKET \
            -e R2_ENDPOINT \
            -e WAVE2_MEDIA_DIR=/media \
            -e WAVE2_WAIT_MS=2700000 \
            -v "$REMOTE_DIR/staging-ingest-live-test-wave2.mjs:/opt/jalwa-ingest/staging-ingest-live-test-wave2.mjs:ro" \
            -v "$media_dir:/media:ro" \
            -w /tmp/jalwa-ingest \
            node:22-bookworm-slim \
            bash -lc 'mkdir -p /tmp/jalwa-ingest && cd /tmp/jalwa-ingest && cp /opt/jalwa-ingest/staging-ingest-live-test-wave2.mjs . && printf "%s\n" "{\"name\":\"jalwa-wave2\",\"type\":\"module\"}" > package.json && npm install --no-audit --no-fund pg@8.16.3 @aws-sdk/client-s3@3.758.0 >/tmp/npm.log 2>&1 && node ./staging-ingest-live-test-wave2.mjs' \
            | tee /tmp/wave2-ingest.out
          REMOTE
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST:/tmp/wave2-ingest.out" /tmp/wave2-ingest.out || true
          test -s /tmp/wave2-ingest.out
          grep -E '"published"|"ingest_failed"|"already_ready"' /tmp/wave2-ingest.out || true

      - name: Summarize inventory after rights and waves
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker exec -i jalwa-postgres-staging sh -lc 'psql -X -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -At'" <<'SQL' | tee /tmp/live-test-summary.out
          select json_build_object(
            'approved_live_test_rights', (
              select count(*) from rights_records rr
              join content_items ci on ci.id=rr.content_id
              where rr.status='approved' and exists (
                  select 1 from audit_logs a
                  where a.entity_id=ci.id::text and a.action='rights_approved'
                    and a.metadata->>'importer'='staging-approve-live-test-50-rights.sql'
                )
            ),
            'published_live_test', (
              select count(*) from content_items
              where status='published'
                and slug in (
                  'mossy-tree-cc0','baking-cookies-cc0','ocean-surface-waves-cc0','tiny-waterfall-cc0',
                  'tree-trimmer-cc0','counting-chisenbop-cc0','vanellus-vanellus-cc0',
                  'vhs-static-cc0-clip','how-fossils-form-cc-by','proxima-centauri-flythrough-cc-by',
                  'huamei-bird-calling-cc0','house-sparrow-tschilp-cc0','abrasive-bird-debate-cc0',
                  'eso-cast-254-light','eso-cast-265-light','big-buck-bunny',
                  'nasa-images-library-home-link','eso-public-videos-link'
                )
            ),
            'ready_media', (
              select count(*) from media_assets a
              join content_items ci on ci.id=a.content_id
              where a.status='ready' and ci.slug in (
                'mossy-tree-cc0','baking-cookies-cc0','ocean-surface-waves-cc0','tiny-waterfall-cc0',
                'tree-trimmer-cc0','counting-chisenbop-cc0','vanellus-vanellus-cc0',
                'vhs-static-cc0-clip','how-fossils-form-cc-by','proxima-centauri-flythrough-cc-by',
                'huamei-bird-calling-cc0','house-sparrow-tschilp-cc0','abrasive-bird-debate-cc0',
                'eso-cast-254-light','eso-cast-265-light','big-buck-bunny'
              )
            ),
            'held_pending', (
              select count(*) from rights_records rr
              join content_items ci on ci.id=rr.content_id
              where rr.status='pending' and ci.slug in (
                'khyber-karma-dvids','op-mustang-dvids','rawhide-ii-border-hub-dvids',
                'chauntra-village-spring','eastern-hindu-kush-lowari','hunza-valley-wle-2018','indus-kotri-barrage',
                'earthrise-45th-svs','artemis-i-overview-svs','artemis-science-lunar-flyby-svs',
                'eso-vista-cosmos-zoom','proxima-centauri-eso-medium'
              )
            ),
            'published_slugs', (
              select coalesce(json_agg(slug order by slug), '[]'::json) from content_items
              where status='published' and slug like '%'
                and (
                  slug in (
                    'mossy-tree-cc0','baking-cookies-cc0','ocean-surface-waves-cc0','tiny-waterfall-cc0',
                    'tree-trimmer-cc0','counting-chisenbop-cc0','vanellus-vanellus-cc0',
                    'vhs-static-cc0-clip','how-fossils-form-cc-by','proxima-centauri-flythrough-cc-by',
                    'huamei-bird-calling-cc0','house-sparrow-tschilp-cc0','abrasive-bird-debate-cc0',
                    'eso-cast-254-light','eso-cast-265-light','big-buck-bunny',
                    'nasa-images-library-home-link','eso-public-videos-link'
                  )
                )
            )
          );
          SQL

      - name: Write summary
        run: |
          {
            echo '### Staging live-test rights + wave1/wave2 publish'
            echo "- Exact SHA: \`$GITHUB_SHA\`"
            echo "- Domain: https://$DOMAIN"
            echo '- Scope: staging only; production unchanged'
            echo '```'
            cat /tmp/rights-approve.out || true
            echo
            cat /tmp/live-test-summary.out || true
            echo
            cat /tmp/wave2-ingest.out || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
