name: Temporary staging certification dispatcher

on:
  push:
    branches:
      - ops/dispatch-staging-certification-20260903

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical staging certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"release_sha":"70dddd399fffdc56e76073dd9513e9842e5febe5","deployment_run_id":"33737399767","minimum_content_items":"0"}}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Watch-Jalwa/jalwa-platform/actions/workflows/staging-acceptance.yml/dispatches \
            -d "$payload"
          echo 'Canonical staging certification dispatched for exact deployed main SHA.'
