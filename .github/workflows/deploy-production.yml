name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact green main commit SHA to deploy
        required: true
        type: string
      confirm_production:
        description: Confirm this is an intentional production deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: jalwa-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-web
  WORKER_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-worker

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_INCOMING_BUCKET: ${{ vars.R2_INCOMING_BUCKET }}
      R2_PROCESSED_BUCKET: ${{ vars.R2_PROCESSED_BUCKET }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
      MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
      RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
      RECOMMENDATION_REFRESH_SECRET: ${{ secrets.RECOMMENDATION_REFRESH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ACCOUNT_REQUEST_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_REQUEST_PROCESSOR_SECRET }}
      ACCOUNT_DELETION_HASH_SECRET: ${{ secrets.ACCOUNT_DELETION_HASH_SECRET }}
      OPERATIONS_DIAGNOSTICS_SECRET: ${{ secrets.OPERATIONS_DIAGNOSTICS_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.SELF_HOSTED_POSTGRES_PASSWORD }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
      SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
      PAYFAST_CHECKOUT_URL: ${{ vars.PAYFAST_CHECKOUT_URL }}
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
      PAYFAST_SECRET: ${{ secrets.PAYFAST_SECRET }}
      JAZZCASH_CHECKOUT_URL: ${{ vars.JAZZCASH_CHECKOUT_URL }}
      JAZZCASH_MERCHANT_ID: ${{ secrets.JAZZCASH_MERCHANT_ID }}
      JAZZCASH_SECRET: ${{ secrets.JAZZCASH_SECRET }}
      EASYPAISA_CHECKOUT_URL: ${{ vars.EASYPAISA_CHECKOUT_URL }}
      EASYPAISA_STORE_ID: ${{ secrets.EASYPAISA_STORE_ID }}
      EASYPAISA_SECRET: ${{ secrets.EASYPAISA_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Validate exact production request
        run: |
          set -euo pipefail
          test '${{ inputs.confirm_production }}' = 'true' || { echo 'Production confirmation is required.' >&2; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || { echo 'Production deploys must run from main.' >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a 40-character lowercase SHA.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          required=(
            PRODUCTION_HOST PRODUCTION_DOMAIN PRODUCTION_SSH_KNOWN_HOSTS PRODUCTION_SSH_KEY
            GHCR_USERNAME GHCR_DEPLOY_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_INCOMING_BUCKET R2_PROCESSED_BUCKET R2_BACKUP_BUCKET
            MEDIA_SIGNING_SECRET RATE_LIMIT_SALT RECOMMENDATION_REFRESH_SECRET CRON_SECRET
            ACCOUNT_REQUEST_PROCESSOR_SECRET ACCOUNT_DELETION_HASH_SECRET OPERATIONS_DIAGNOSTICS_SECRET
            DEEPSEEK_API_KEY PAYMENT_WEBHOOK_SECRET POSTGRES_PASSWORD BETTER_AUTH_SECRET
            SMTP_HOST SMTP_USER SMTP_PASS SMTP_ADMIN_EMAIL SMTP_SENDER_NAME BACKUP_AGE_IDENTITY PAYMENT_PROVIDER
          )
          for name in "${required[@]}"; do test -n "${!name:-}" || { echo "Missing production value $name" >&2; exit 1; }; done
          test ${#BETTER_AUTH_SECRET} -ge 32
          grep -q "$PRODUCTION_HOST" <<<"$PRODUCTION_SSH_KNOWN_HOSTS"
          grep -q '^AGE-SECRET-KEY-' <<<"$BACKUP_AGE_IDENTITY"
          case "$PAYMENT_PROVIDER" in
            payfast) test -n "$PAYFAST_CHECKOUT_URL" && test -n "$PAYFAST_MERCHANT_ID" && test -n "$PAYFAST_SECRET" ;;
            jazzcash) test -n "$JAZZCASH_CHECKOUT_URL" && test -n "$JAZZCASH_MERCHANT_ID" && test -n "$JAZZCASH_SECRET" ;;
            easypaisa) test -n "$EASYPAISA_CHECKOUT_URL" && test -n "$EASYPAISA_STORE_ID" && test -n "$EASYPAISA_SECRET" ;;
            *) echo 'Production PAYMENT_PROVIDER must be payfast, jazzcash or easypaisa.' >&2; exit 1 ;;
          esac
          infrastructure/production/scripts/validate-production.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable production web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WEB_IMAGE }}:${{ inputs.release_sha }}
          build-args: |
            GIT_SHA=${{ inputs.release_sha }}
            BUILD_RUN_ID=${{ github.run_id }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.PRODUCTION_DOMAIN }}
            NEXT_PUBLIC_ENABLE_PHONE_AUTH=false
            NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=${{ vars.NEXT_PUBLIC_ENABLE_GOOGLE_AUTH || 'false' }}
            NEXT_PUBLIC_ENABLE_APPLE_AUTH=${{ vars.NEXT_PUBLIC_ENABLE_APPLE_AUTH || 'false' }}
            NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=${{ vars.NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH || 'false' }}
            NEXT_PUBLIC_ENABLE_LIVE_STREAMING=${{ vars.NEXT_PUBLIC_ENABLE_LIVE_STREAMING || 'false' }}
            NEXT_PUBLIC_ENABLE_WEB_DRM=${{ vars.NEXT_PUBLIC_ENABLE_WEB_DRM || 'false' }}
      - name: Build and push immutable production worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: worker
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WORKER_IMAGE }}:${{ inputs.release_sha }}
          build-args: |
            GIT_SHA=${{ inputs.release_sha }}
            BUILD_RUN_ID=${{ github.run_id }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      HOST: ${{ vars.PRODUCTION_HOST }}
      USER: ${{ vars.PRODUCTION_USER || 'jalwa' }}
      DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_sha }}
      - name: Configure pinned production SSH identity
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" true
      - name: Generate production runtime environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.SELF_HOSTED_POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_INCOMING_BUCKET: ${{ vars.R2_INCOMING_BUCKET }}
          R2_PROCESSED_BUCKET: ${{ vars.R2_PROCESSED_BUCKET }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          OBSERVABILITY_HASH_SALT: ${{ secrets.OBSERVABILITY_HASH_SALT }}
          OPERATIONS_DIAGNOSTICS_SECRET: ${{ secrets.OPERATIONS_DIAGNOSTICS_SECRET }}
          RECOMMENDATION_REFRESH_SECRET: ${{ secrets.RECOMMENDATION_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ACCOUNT_REQUEST_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_REQUEST_PROCESSOR_SECRET }}
          ACCOUNT_DELETION_HASH_SECRET: ${{ secrets.ACCOUNT_DELETION_HASH_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          PAYFAST_CHECKOUT_URL: ${{ vars.PAYFAST_CHECKOUT_URL }}
          PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
          PAYFAST_SECRET: ${{ secrets.PAYFAST_SECRET }}
          JAZZCASH_CHECKOUT_URL: ${{ vars.JAZZCASH_CHECKOUT_URL }}
          JAZZCASH_MERCHANT_ID: ${{ secrets.JAZZCASH_MERCHANT_ID }}
          JAZZCASH_SECRET: ${{ secrets.JAZZCASH_SECRET }}
          EASYPAISA_CHECKOUT_URL: ${{ vars.EASYPAISA_CHECKOUT_URL }}
          EASYPAISA_STORE_ID: ${{ secrets.EASYPAISA_STORE_ID }}
          EASYPAISA_SECRET: ${{ secrets.EASYPAISA_SECRET }}
        run: |
          set -euo pipefail
          cat > /tmp/jalwa.env <<EOF
          NODE_ENV=production
          DEPLOYMENT_ENVIRONMENT=production
          DOMAIN=$DOMAIN
          APP_URL=https://$DOMAIN
          NEXT_PUBLIC_APP_URL=https://$DOMAIN
          NEXT_PUBLIC_FRONTEND_PREVIEW=false
          NEXT_PUBLIC_STAGING=false
          POSTGRES_DB=postgres
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql://postgres:$POSTGRES_PASSWORD@postgres:5432/postgres
          BETTER_AUTH_URL=https://$DOMAIN
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_SECURE=$SMTP_SECURE
          SMTP_USER=$SMTP_USER
          SMTP_PASSWORD=$SMTP_PASS
          SMTP_FROM=$SMTP_SENDER_NAME <$SMTP_ADMIN_EMAIL>
          NEXT_PUBLIC_ENABLE_PHONE_AUTH=false
          NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=${{ vars.NEXT_PUBLIC_ENABLE_GOOGLE_AUTH || 'false' }}
          NEXT_PUBLIC_ENABLE_APPLE_AUTH=${{ vars.NEXT_PUBLIC_ENABLE_APPLE_AUTH || 'false' }}
          NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=${{ vars.NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH || 'false' }}
          NEXT_PUBLIC_ENABLE_LIVE_STREAMING=${{ vars.NEXT_PUBLIC_ENABLE_LIVE_STREAMING || 'false' }}
          NEXT_PUBLIC_ENABLE_WEB_DRM=${{ vars.NEXT_PUBLIC_ENABLE_WEB_DRM || 'false' }}
          ENABLE_LIVE_STREAMING=${{ vars.NEXT_PUBLIC_ENABLE_LIVE_STREAMING || 'false' }}
          PUBLIC_DOMAIN_LIVE_SOURCES_ENABLED=${{ vars.PUBLIC_DOMAIN_LIVE_SOURCES_ENABLED || 'false' }}
          ENABLE_WEB_DRM=${{ vars.NEXT_PUBLIC_ENABLE_WEB_DRM || 'false' }}
          R2_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_ENDPOINT=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com
          R2_INCOMING_BUCKET=$R2_INCOMING_BUCKET
          R2_PROCESSED_BUCKET=$R2_PROCESSED_BUCKET
          R2_BACKUP_BUCKET=$R2_BACKUP_BUCKET
          NEXT_PUBLIC_MEDIA_GATEWAY_URL=https://media.$DOMAIN
          MEDIA_SIGNING_SECRET=$MEDIA_SIGNING_SECRET
          MEDIA_GATEWAY_ALLOWED_ORIGINS=https://$DOMAIN,https://www.$DOMAIN
          RATE_LIMIT_SALT=$RATE_LIMIT_SALT
          OBSERVABILITY_HASH_SALT=$OBSERVABILITY_HASH_SALT
          OPERATIONS_DIAGNOSTICS_SECRET=$OPERATIONS_DIAGNOSTICS_SECRET
          RECOMMENDATION_REFRESH_SECRET=$RECOMMENDATION_REFRESH_SECRET
          CRON_SECRET=$CRON_SECRET
          ACCOUNT_REQUEST_PROCESSOR_SECRET=$ACCOUNT_REQUEST_PROCESSOR_SECRET
          ACCOUNT_DELETION_HASH_SECRET=$ACCOUNT_DELETION_HASH_SECRET
          AI_ENABLED=true
          AI_PROVIDER=deepseek
          AI_API_KEY=$DEEPSEEK_API_KEY
          AI_BASE_URL=https://api.deepseek.com
          AI_MODEL=deepseek-v4-flash
          AI_MODERATION_MODE=provider
          AI_MODERATION_MODEL=deepseek-v4-flash
          PAYMENT_PROVIDER=$PAYMENT_PROVIDER
          PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET
          ALLOW_MOCK_PAYMENTS=false
          PAYFAST_CHECKOUT_URL=$PAYFAST_CHECKOUT_URL
          PAYFAST_MERCHANT_ID=$PAYFAST_MERCHANT_ID
          PAYFAST_SECRET=$PAYFAST_SECRET
          JAZZCASH_CHECKOUT_URL=$JAZZCASH_CHECKOUT_URL
          JAZZCASH_MERCHANT_ID=$JAZZCASH_MERCHANT_ID
          JAZZCASH_SECRET=$JAZZCASH_SECRET
          EASYPAISA_CHECKOUT_URL=$EASYPAISA_CHECKOUT_URL
          EASYPAISA_STORE_ID=$EASYPAISA_STORE_ID
          EASYPAISA_SECRET=$EASYPAISA_SECRET
          JALWA_IMAGE_TAG=$RELEASE_SHA
          GIT_SHA=$RELEASE_SHA
          BUILD_RUN_ID=${{ github.run_id }}
          EOF
          chmod 600 /tmp/jalwa.env
      - name: Install production release assets
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            'mkdir -p /opt/jalwa/scripts /opt/jalwa/systemd /opt/jalwa/migrations /opt/jalwa/backups/postgres /opt/jalwa/operations /opt/jalwa/secrets /opt/jalwa/deployments'
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/docker-compose.yml "$USER@$HOST:/opt/jalwa/docker-compose.yml"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/Caddyfile "$USER@$HOST:/opt/jalwa/Caddyfile"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/scripts/*.sh "$USER@$HOST:/opt/jalwa/scripts/"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/systemd/* "$USER@$HOST:/opt/jalwa/systemd/"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa database/bootstrap.sql "$USER@$HOST:/opt/jalwa/bootstrap.sql"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa database/migrations/*.sql "$USER@$HOST:/opt/jalwa/migrations/"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa /tmp/jalwa.env "$USER@$HOST:/opt/jalwa/.env.production"
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > /tmp/backup-age.key
          chmod 600 /tmp/backup-age.key
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa /tmp/backup-age.key "$USER@$HOST:/opt/jalwa/secrets/backup-age.key"
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin >/dev/null"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            'chmod 600 /opt/jalwa/.env.production /opt/jalwa/secrets/backup-age.key && chmod 750 /opt/jalwa/scripts/*.sh'
      - name: Back up, migrate and deploy exact production release
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" "set -euo pipefail
            cd /opt/jalwa
            docker compose --env-file .env.production config --quiet
            docker compose --env-file .env.production up -d postgres --wait
            if docker exec jalwa-postgres psql -U postgres -d postgres -Atqc \"select to_regclass('public.jalwa_schema_migrations') is not null\" | grep -qx t; then BACKUP_REASON=pre-migration ./scripts/backup-postgres.sh; fi
            ./scripts/apply-migrations.sh
            ./scripts/install-operations.sh
            ./scripts/deploy-release.sh '$RELEASE_SHA' '$DOMAIN'
            ./scripts/capture-release-identity.sh '$RELEASE_SHA' '${{ github.run_id }}'
            BACKUP_REASON=post-release ./scripts/backup-postgres.sh
            ./scripts/restore-drill.sh
            ./scripts/host-acceptance.sh 'https://$DOMAIN'"
      - name: Deployment summary
        run: |
          {
            echo '### Production deployment passed'
            echo "- Release: \`$RELEASE_SHA\`"
            echo '- Architecture: direct PostgreSQL + Better Auth + SMTP + R2'
            echo '- Mock payments: disabled'
            echo '- Encrypted backup and restore drill: passed'
          } >> "$GITHUB_STEP_SUMMARY"
