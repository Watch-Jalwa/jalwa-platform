name: Temporary inspect on-prem Jalwa identity

on:
  push:
    branches:
      - ops/dispatch-onprem-staging-20260901-2207
    paths:
      - .github/workflows/tmp-probe-onprem-ssh-user.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      HOST: jalwa-platform.codistan.org
      USER: codistan
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Inspect Jalwa container identity without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          for c in jalwa-postgres-staging jalwa-web-staging jalwa-worker-staging; do
            echo "--- $c ---"
            docker inspect -f 'IMAGE={{.Config.Image}} PROJECT={{ index .Config.Labels "com.docker.compose.project" }} SERVICE={{ index .Config.Labels "com.docker.compose.service" }} WORKDIR={{ index .Config.Labels "com.docker.compose.project.working_dir" }} FILES={{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$c"
            docker inspect -f '{{range .Mounts}}MOUNT type={{.Type}} name={{.Name}} source={{.Source}} dest={{.Destination}}{{println}}{{end}}' "$c"
            docker inspect -f '{{range $name, $conf := .NetworkSettings.Networks}}NETWORK {{$name}}{{println}}{{end}}' "$c"
          done
          echo '--- WEB PORTS ---'
          docker port jalwa-web-staging || true
          echo '--- WEB HEALTH ---'
          docker inspect -f 'status={{.State.Health.Status}}{{range .State.Health.Log}}{{println}}{{.ExitCode}} {{.Output}}{{end}}' jalwa-web-staging 2>/dev/null | tail -30 || true
          echo '--- LOCAL HEALTH ---'
          curl -sS -o /tmp/jalwa-health.out -w 'health_http=%{http_code}\n' http://127.0.0.1:3000/api/health || true
          head -c 500 /tmp/jalwa-health.out 2>/dev/null || true
          echo
          REMOTE
