name: Temporary inspect on-prem Jalwa runtime config

on:
  push:
    branches:
      - ops/dispatch-onprem-staging-20260901-2207
    paths:
      - .github/workflows/tmp-probe-onprem-ssh-user.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      HOST: jalwa-platform.codistan.org
      USER: codistan
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Inspect non-secret runtime settings and Compose references
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/opt/codistan/jalwa-platform
          cd "$root"
          echo '--- COMPOSE SERVICES ---'
          docker compose --project-name jalwa-platform --env-file .env.staging -f docker-compose.staging.yml config --services
          echo '--- COMPOSE IMAGES ---'
          docker compose --project-name jalwa-platform --env-file .env.staging -f docker-compose.staging.yml config --images
          echo '--- SAFE ENV SETTINGS ---'
          awk -F= '$1 ~ /^(DEPLOYMENT_ENVIRONMENT|PORT|HOSTNAME|NODE_ENV|PAYMENT_PROVIDER|ALLOW_MOCK_PAYMENTS|MEDIA_BACKEND|TRANSCODE_BACKEND|MEDIA_GATEWAY_MODE|NEXT_PUBLIC_FRONTEND_PREVIEW|JALWA_WEB_PORT|POSTGRES_IMAGE)$/ {print $1"="$2}' .env.staging | sort
          echo '--- REQUIRED VALUE PRESENCE ---'
          for name in DATABASE_URL BETTER_AUTH_SECRET BETTER_AUTH_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_INCOMING_BUCKET R2_PROCESSED_BUCKET R2_BACKUP_BUCKET R2_ENDPOINT MEDIA_SIGNING_SECRET SMTP_HOST SMTP_USER BACKUP_AGE_IDENTITY POSTGRES_PASSWORD DEEPSEEK_API_KEY; do
            if grep -qE "^${name}=.+" .env.staging; then echo "$name=yes"; else echo "$name=no"; fi
          done
          REMOTE
