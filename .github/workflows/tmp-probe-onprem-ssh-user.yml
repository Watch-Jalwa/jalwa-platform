name: Temporary locate on-prem Jalwa runtime

on:
  push:
    branches:
      - ops/dispatch-onprem-staging-20260901-2207
    paths:
      - .github/workflows/tmp-probe-onprem-ssh-user.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      HOST: jalwa-platform.codistan.org
      USER: codistan
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Locate current Compose/env paths without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '--- RUNNING CONTAINERS ---'
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}'
          echo '--- COMPOSE METADATA ---'
          for c in $(docker ps --format '{{.Names}}'); do
            project=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$c" 2>/dev/null || true)
            workdir=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$c" 2>/dev/null || true)
            files=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$c" 2>/dev/null || true)
            service=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$c" 2>/dev/null || true)
            if [ -n "$project$workdir$files$service" ]; then
              echo "$c|project=$project|service=$service|working_dir=$workdir|config_files=$files"
            fi
          done
          echo '--- ENV FILE PATHS ---'
          find /home/codistan /opt /srv /var/www -maxdepth 5 -type f \( -name '.env.staging' -o -name 'env.staging' -o -name '.env.production' \) -print 2>/dev/null | sort -u | head -50
          echo '--- COMPOSE FILE PATHS ---'
          find /home/codistan /opt /srv /var/www -maxdepth 5 -type f \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' -o -name 'compose.yml' -o -name 'compose.yaml' \) -print 2>/dev/null | sort -u | head -50
          REMOTE
