name: Temporary probe on-prem deployment capabilities

on:
  push:
    branches:
      - ops/dispatch-onprem-staging-20260901-2207
    paths:
      - .github/workflows/tmp-probe-onprem-ssh-user.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      HOST: jalwa-platform.codistan.org
      USER: codistan
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Verify read-only deployment capabilities
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" 'set -euo pipefail; echo USER=$(id -un); echo GROUPS=$(id -Gn); test -d /opt/jalwa && echo APP_DIR_EXISTS=yes || echo APP_DIR_EXISTS=no; test -w /opt/jalwa && echo APP_DIR_WRITABLE=yes || echo APP_DIR_WRITABLE=no; command -v docker >/dev/null && echo DOCKER_BIN=yes || echo DOCKER_BIN=no; docker compose version >/dev/null 2>&1 && echo DOCKER_COMPOSE=yes || echo DOCKER_COMPOSE=no; docker ps >/dev/null 2>&1 && echo DOCKER_ACCESS=yes || echo DOCKER_ACCESS=no; sudo -n true >/dev/null 2>&1 && echo PASSWORDLESS_SUDO=yes || echo PASSWORDLESS_SUDO=no; test -s /opt/jalwa/.env.staging && echo ENV_STAGING_EXISTS=yes || echo ENV_STAGING_EXISTS=no'
