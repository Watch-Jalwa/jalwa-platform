name: Apply verified final refactor

on:
  push:
    branches:
      - chore/permanent-staging-certification

permissions:
  contents: write

concurrency:
  group: jalwa-verified-final-refactor
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/permanent-staging-certification
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Recover, apply and self-clean verified refactor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path
          import base64
          import lzma
          import string

          alphabet = set(string.ascii_letters + string.digits + '+/=')
          parts = []
          for i in range(15):
              text = Path(f'.github/final-refactor.part{i:02d}').read_text()
              clean = ''.join(text.split())
              bad = sorted(set(clean) - alphabet)
              if bad:
                  raise SystemExit(f'Unexpected non-base64 characters in part {i:02d}: {bad}')
              parts.append(clean)

          print('payload part lengths:', [len(p) for p in parts])
          suspect_parts = [i for i, p in enumerate(parts[:-1]) if len(p) != 18000]
          if suspect_parts != [8] or len(parts[8]) != 18001:
              raise SystemExit(f'Unexpected payload shape; suspect parts: {suspect_parts}')

          prefix = ''.join(parts[:8])
          target = parts[8]
          suffix = ''.join(parts[9:])
          recovered = None
          recovered_at = None
          for pos in range(len(target)):
              candidate = prefix + target[:pos] + target[pos + 1:] + suffix
              try:
                  compressed = base64.b64decode(candidate, validate=True)
                  patch = lzma.decompress(compressed)
              except (ValueError, lzma.LZMAError):
                  continue
              if b'diff --git ' not in patch:
                  continue
              recovered = patch
              recovered_at = pos
              break

          if recovered is None:
              raise SystemExit('Unable to recover a checksum-valid XZ payload from the single anomalous segment.')
          Path('/tmp/final-refactor.patch').write_bytes(recovered)
          print(f'Recovered checksum-valid refactor payload by removing one character from part08 at offset {recovered_at}.')
          PY
          git apply --check /tmp/final-refactor.patch
          git apply /tmp/final-refactor.patch
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm test --workspace @jalwa/web
          rm -f .github/final-refactor.part*
          rm -f .github/refactor-patch.part* .github/refactor-postgres.part*
          rm -f .github/workflows/tmp-apply-final-refactor.yml
          rm -f .github/workflows/tmp-source-bundle.yml
          rm -f .github/workflows/tmp-lock-bundle.yml
          rm -f .github/workflows/dev-source-snapshot.yml
          git add -A
          git diff --cached --check
          git config user.name 'jalwa-release-bot'
          git config user.email 'jalwa-release-bot@users.noreply.github.com'
          git commit -m 'Complete PostgreSQL and Better Auth staging refactor'
          git push origin HEAD:chore/permanent-staging-certification
