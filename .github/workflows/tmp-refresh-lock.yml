name: Temporary lockfile refresh

on:
  push:
    branches:
      - chore/permanent-staging-certification

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/permanent-staging-certification
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh and verify lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm test --workspace @jalwa/web
          git diff --check
          git config user.name 'jalwa-release-bot'
          git config user.email 'jalwa-release-bot@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile for patched Nodemailer'
          git push origin HEAD:chore/permanent-staging-certification
