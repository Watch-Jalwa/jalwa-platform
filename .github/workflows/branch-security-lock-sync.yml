name: Branch dependency lock regeneration and diagnostics (temporary)

on:
  push:
    branches: ["fix/security-ci-on-video-20261104"]

permissions:
  contents: read

jobs:
  verify-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Resolve patched dependency lock without install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund
      - name: Emit deterministic lockfile chunks for reviewed GitHub connector commit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const value = fs.readFileSync('package-lock.json', 'utf8');
          console.log('LOCK_BEGIN:' + value.length + ':' + crypto.createHash('sha256').update(value).digest('hex'));
          for (let index = 0, position = 0; position < value.length; index++, position += 2000) {
            console.log('LOCKCHUNK_' + String(index).padStart(4, '0') + '=' + JSON.stringify(value.slice(position, position + 2000)));
          }
          console.log('LOCK_END');
          NODE
      - name: Install regenerated exact lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Diagnose web lint
        if: always()
        continue-on-error: true
        run: npm run lint --workspace @jalwa/web
      - name: Diagnose web tests
        if: always()
        continue-on-error: true
        run: npm test --workspace @jalwa/web
      - name: Diagnose web typecheck
        if: always()
        continue-on-error: true
        run: npm run typecheck --workspace @jalwa/web
