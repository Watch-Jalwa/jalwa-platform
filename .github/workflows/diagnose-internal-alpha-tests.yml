name: Diagnose internal alpha tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-internal-alpha-tests.yml"

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/internal-alpha-content-platform
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run web tests only
        run: npm test --workspace @jalwa/web

  worker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/internal-alpha-content-platform
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run worker tests only
        run: npm test --workspace @jalwa/worker
