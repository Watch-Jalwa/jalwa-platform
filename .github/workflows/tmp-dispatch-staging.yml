name: Temporary staging dispatcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-dispatch-staging.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for exact main CI then dispatch staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          success=false
          for attempt in $(seq 1 120); do
            runs="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            status="$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].status // "missing"' <<<"$runs")"
            conclusion="$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].conclusion // ""' <<<"$runs")"
            if [[ "$status" == completed && "$conclusion" == success ]]; then
              success=true
              break
            fi
            if [[ "$status" == completed && "$conclusion" != success ]]; then
              echo "CI completed with $conclusion; refusing staging dispatch." >&2
              exit 1
            fi
            sleep 10
          done
          [[ "$success" == true ]] || { echo 'Timed out waiting for exact main CI.' >&2; exit 1; }
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/workflows/deploy-staging.yml/dispatches" \
            -d '{"ref":"main"}'
