name: Repair retained VHS Static and Sintel originals
on:
  push:
    branches: [ops/retained-media-repair-20261106]
    paths: [.github/workflows/retained-repair-process-20261106.yml, ops/retained-repair-20261106/repair.mjs, ops/retained-repair-20261106/process.sh]
permissions:
  contents: read
concurrency:
  group: jalwa-staging
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      RELEASE_SHA: 0c8f09c0a59d0e98d9725c40c7bdffa8a989eb44
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      STAGE_USER: ${{ vars.STAGING_USER || 'codistan' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate and repair exact retained source assets
        run: |
          bash -n ops/retained-repair-20261106/process.sh
          node --check ops/retained-repair-20261106/repair.mjs
          bash ops/retained-repair-20261106/process.sh
      - name: Read retained-film credit frames
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install tesseract-ocr >/dev/null
          for frame in evidence/sintel-credit-*.jpg; do
            echo "FRAME ${frame##*/}"
            tesseract "$frame" stdout --psm 11 2>/dev/null
          done | tee evidence/sintel-credits.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
