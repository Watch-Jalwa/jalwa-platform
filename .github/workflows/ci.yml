name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      - name: Validate infrastructure files
        run: |
          terraform fmt -check -recursive infrastructure/digitalocean
          infrastructure/production/scripts/validate-production.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://api.example.com
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_anon_placeholder
          NEXT_PUBLIC_ENABLE_PHONE_AUTH: "false"
          NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
          NEXT_PUBLIC_ENABLE_APPLE_AUTH: "false"
          NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH: "false"

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap Supabase-compatible roles
        run: psql --set ON_ERROR_STOP=1 --file scripts/ci-bootstrap-postgres.sql
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for migration in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying ${migration}"
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Verify production privileges
        run: psql --set ON_ERROR_STOP=1 --file scripts/ci-verify-production-schema.sql
