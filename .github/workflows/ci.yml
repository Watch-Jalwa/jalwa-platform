name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      - name: Validate infrastructure files
        run: |
          terraform fmt -check -recursive infrastructure/digitalocean
          infrastructure/production/scripts/validate-production.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install backup encryption tooling
        run: |
          set -euo pipefail
          if command -v age >/dev/null; then
            age --version
            exit 0
          fi
          if timeout 90s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y age; then
            age --version
            exit 0
          fi
          timeout 90s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 90s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y age
          age --version
      - name: Verify dependency tree
        run: npm ls --all
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate and validate CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > /tmp/jalwa-sbom.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' /tmp/jalwa-sbom.json >/dev/null
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Run AI readiness gate
        run: npm run test:ai
      - run: npm run test:release
      - run: npm run test:backup-encryption
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci_better_auth_secret_that_is_long_enough_for_builds
          SMTP_HOST: localhost
          SMTP_FROM: no-reply@example.com
          NEXT_PUBLIC_ENABLE_PHONE_AUTH: "false"
          NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
          NEXT_PUBLIC_ENABLE_APPLE_AUTH: "false"
          NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH: "false"
          NEXT_PUBLIC_ENABLE_LIVE_STREAMING: "false"
          NEXT_PUBLIC_ENABLE_WEB_DRM: "false"

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap PostgreSQL compatibility roles
        run: psql --set ON_ERROR_STOP=1 --file database/bootstrap.sql
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Verify production privileges
        run: psql --set ON_ERROR_STOP=1 --file scripts/ci-verify-production-schema.sql

  container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: validate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build production web image
        run: |
          docker build --target web \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_ENABLE_PHONE_AUTH=false \
            --build-arg NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=false \
            --build-arg NEXT_PUBLIC_ENABLE_APPLE_AUTH=false \
            --build-arg NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=false \
            --build-arg NEXT_PUBLIC_ENABLE_LIVE_STREAMING=false \
            --build-arg NEXT_PUBLIC_ENABLE_WEB_DRM=false \
            -t jalwa-web:ci .
      - name: Build production worker image
        run: docker build --target worker -t jalwa-worker:ci .
      - name: Install verified vulnerability scanner
        run: bash scripts/install-trivy.sh
      - name: Reject fixable high and critical image vulnerabilities
        run: bash scripts/scan-container-images.sh jalwa-web:ci jalwa-worker:ci
      - name: Verify runtime image contracts
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' jalwa-web:ci)" = node
          test "$(docker image inspect --format '{{.Config.User}}' jalwa-worker:ci)" = node
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' jalwa-web:ci)" != null
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' jalwa-worker:ci)" != null
      - name: Boot and test production web image
        run: bash scripts/test-production-container.sh jalwa-web:ci "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned browser acceptance harness
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.61.1
          npx playwright install --with-deps chromium
      - name: Run production browser journeys
        run: bash scripts/test-browser-acceptance.sh jalwa-web:ci "$GITHUB_SHA"
