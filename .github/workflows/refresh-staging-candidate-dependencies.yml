name: Refresh staging candidate dependencies

on:
  push:
    branches: ["fix/staging-certification-blockers"]
    paths:
      - ".github/workflows/refresh-staging-candidate-dependencies.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/staging-certification-blockers
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate secure lockfile and self-remove
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const webPath = 'apps/web/package.json';
          const rootPath = 'package.json';
          const web = JSON.parse(fs.readFileSync(webPath, 'utf8'));
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          web.dependencies.nodemailer = '^9.1.1';
          root.overrides.next.sharp = '0.35.4';
          fs.writeFileSync(webPath, JSON.stringify(web, null, 2) + '\n');
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');
          NODE
          npm install nodemailer@9.1.1 --workspace=@jalwa/web --package-lock-only --force --ignore-scripts --no-audit --no-fund
          npm update sharp --package-lock-only --force --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node -e "const l=require('./package-lock.json'); if(l.packages['apps/web/node_modules/nodemailer']?.version!=='9.1.1') process.exit(1); if(l.packages['node_modules/sharp']?.version!=='0.35.4') process.exit(1)"
          git rm .github/workflows/refresh-staging-candidate-dependencies.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json apps/web/package.json package-lock.json
          git commit -m "Update dependencies for staging candidate security"
          git push origin HEAD:fix/staging-certification-blockers
