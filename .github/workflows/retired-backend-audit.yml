name: Retired backend audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/permanent-staging-certification]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fail-closed application and deployment tests
        run: npm test --workspace @jalwa/web
      - name: Validate production and staging contracts
        run: infrastructure/production/scripts/validate-production.sh
