name: Refresh patched nanoid lock entry

on:
  push:
    branches:
      - chore/permanent-staging-certification

permissions:
  contents: write

concurrency:
  group: refresh-nanoid-lock
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/permanent-staging-certification
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Refresh only the lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency and narrow change
        run: |
          set -euo pipefail
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/nanoid']?.version !== '3.3.18') process.exit(1)"
          rm .github/workflows/refresh-nanoid-lock.yml
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/refresh-nanoid-lock.yml' 'package-lock.json' | sort)"
          test "$changed" = "$expected" || { echo "Unexpected files changed:" >&2; git status --short >&2; exit 1; }
          git diff --check
      - name: Commit refreshed lock and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/refresh-nanoid-lock.yml
          git commit -m 'Refresh nanoid security lock entry'
          git push origin HEAD:chore/permanent-staging-certification
