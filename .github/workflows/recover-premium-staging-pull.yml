name: Recover Premium worker image via trusted runner

on:
  push:
    branches:
      - diagnostics/premium-deploy-9d07
    paths:
      - .github/workflows/recover-premium-staging-pull.yml

permissions:
  contents: read
  packages: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      RELEASE_SHA: 9d07aae93b7cf1d2c50936e93f62c7894f02698c
      WORKER_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-worker:9d07aae93b7cf1d2c50936e93f62c7894f02698c
    steps:
      - name: Configure pinned SSH identity
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Pull immutable worker image on trusted GitHub runner
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$WORKER_IMAGE"
          test "$(docker image inspect --format '{{index .RepoDigests 0}}' "$WORKER_IMAGE" | cut -d@ -f2)" != ""
          docker image inspect --format 'runner-image={{.Id}} size={{.Size}} digests={{json .RepoDigests}}' "$WORKER_IMAGE"

      - name: Stream exact worker image into staging Docker cache
        run: |
          set -euo pipefail
          docker save "$WORKER_IMAGE" | gzip -1 | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/jalwa "$USER@$HOST" \
            "gzip -d | docker load"
          local_id="$(docker image inspect --format '{{.Id}}' "$WORKER_IMAGE")"
          remote_id="$(ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" "docker image inspect --format '{{.Id}}' '$WORKER_IMAGE'")"
          test "$remote_id" = "$local_id"
          echo "Exact worker image loaded on staging: $remote_id"

      - name: Verify staging runtime remained unchanged
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker ps --format '{{.Names}}|{{.Status}}|{{.Image}}' | grep '^jalwa-'"
