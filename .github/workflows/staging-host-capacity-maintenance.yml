name: Staging host capacity maintenance

on:
  workflow_dispatch:
  push:
    branches: ["fix/staging-certification-blockers"]

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure pinned staging SSH identity
        run: |
          set -euo pipefail
          test "$USER" = codistan
          test "$APP_DIR" = /opt/codistan/jalwa-platform
          test -n "$HOST" && test -n "$KNOWN_HOSTS" && test -n "$SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Install and run safe staging host capacity reclaim
        run: |
          set -euo pipefail
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa \
            infrastructure/production/scripts/reclaim-staging-host-capacity.sh \
            "$USER@$HOST:$APP_DIR/scripts/reclaim-staging-host-capacity.sh"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "chmod 755 '$APP_DIR/scripts/reclaim-staging-host-capacity.sh' && APP_DIR='$APP_DIR' '$APP_DIR/scripts/reclaim-staging-host-capacity.sh' maintenance"
