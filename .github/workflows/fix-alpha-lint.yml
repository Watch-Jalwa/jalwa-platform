name: Fix internal alpha lint finding

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-alpha-lint.yml"

permissions:
  contents: write

concurrency:
  group: fix-internal-alpha-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/internal-alpha-content-platform
          fetch-depth: 0
          persist-credentials: true

      - name: Remove render-time clock dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/studio/alpha/page.tsx')
          text = path.read_text()
          old = '  const activeGrants = (grants ?? []).filter((row) => row.enabled && (!row.expires_at || new Date(row.expires_at).getTime() > Date.now())).length;'
          new = '  const activeGrants = (grants ?? []).filter((row) => row.enabled).length;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected active-grant expression once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace('<span>Active tester grants</span>', '<span>Enabled tester grants</span>', 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit lint repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jalwa-release-bot"
          git config user.email "release-bot@watch-jalwa.com"
          git add apps/web/app/studio/alpha/page.tsx
          git commit -m "Fix internal alpha dashboard purity"
          git push origin HEAD:agent/internal-alpha-content-platform
