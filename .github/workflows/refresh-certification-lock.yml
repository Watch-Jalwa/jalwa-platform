name: Refresh certification lockfile

on:
  push:
    branches:
      - chore/permanent-staging-certification
    paths:
      - package.json
      - .github/workflows/refresh-certification-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-certification-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/permanent-staging-certification
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh exact lockfile from declared security overrides
        run: npm update postcss nanoid --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched transitive versions and production audit
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock = require('./package-lock.json')
          const postcss = lock.packages?.['node_modules/postcss']?.version
          const nanoid = lock.packages?.['node_modules/nanoid']?.version
          console.log(`postcss=${postcss} nanoid=${nanoid}`)
          if (postcss !== '8.5.24') throw new Error(`PostCSS lock version is ${postcss}, expected 8.5.24`)
          if (nanoid !== '3.3.17') throw new Error(`Nano ID lock version is ${nanoid}, expected 3.3.17`)
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already matches the declared security overrides.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile for patched build dependencies'
          git push origin HEAD:chore/permanent-staging-certification
