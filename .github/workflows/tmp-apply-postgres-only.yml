name: Temporary apply PostgreSQL-only refactor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply verified local refactor
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/refactor-postgres.ready || { echo 'Patch not ready yet.'; exit 0; }
          cat .github/refactor-postgres.part* | base64 -d | gzip -d > /tmp/jalwa-postgres.patch
          git apply --binary --index /tmp/jalwa-postgres.patch
          git rm -f --ignore-unmatch .github/refactor-postgres.part* .github/refactor-postgres.ready .github/workflows/tmp-apply-postgres-only.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove Supabase and run directly on PostgreSQL'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
