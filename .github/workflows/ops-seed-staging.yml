name: Operations seed generated staging values

on:
  push:
    branches: [ops/release-61b29488]
    paths:
      - .github/workflows/ops-seed-staging.yml

permissions:
  actions: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate and store Jalwa-owned staging values
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
          ssh-keygen -q -t ed25519 -N '' -C 'jalwa-staging-deploy' -f /tmp/jalwa-staging-key
          age-keygen -o /tmp/jalwa-backup-age.key >/dev/null

          set_secret() {
            local name="$1" value="$2"
            printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY" --env staging
          }
          random_hex() { openssl rand -hex 32; }

          set_secret STAGING_SSH_KEY "$(cat /tmp/jalwa-staging-key)"
          set_secret DIGITALOCEAN_SSH_PUBLIC_KEY "$(cat /tmp/jalwa-staging-key.pub)"
          set_secret SELF_HOSTED_POSTGRES_PASSWORD "$(random_hex)"
          set_secret BETTER_AUTH_SECRET "$(random_hex)"
          set_secret STAGING_QA_SECRET "$(random_hex)"
          set_secret BACKUP_AGE_IDENTITY "$(cat /tmp/jalwa-backup-age.key)"
          set_secret MEDIA_SIGNING_SECRET "$(random_hex)"
          set_secret RATE_LIMIT_SALT "$(random_hex)"
          set_secret OBSERVABILITY_HASH_SALT "$(random_hex)"
          set_secret RECOMMENDATION_REFRESH_SECRET "$(random_hex)"
          set_secret CRON_SECRET "$(random_hex)"
          set_secret ACCOUNT_REQUEST_PROCESSOR_SECRET "$(random_hex)"
          set_secret ACCOUNT_DELETION_HASH_SECRET "$(random_hex)"
          set_secret OPERATIONS_DIAGNOSTICS_SECRET "$(random_hex)"
          set_secret PAYMENT_WEBHOOK_SECRET "$(random_hex)"

          gh variable set STAGING_USER --repo "$GITHUB_REPOSITORY" --env staging --body jalwa
          gh variable set R2_INCOMING_BUCKET --repo "$GITHUB_REPOSITORY" --env staging --body jalwa-staging-incoming
          gh variable set R2_PROCESSED_BUCKET --repo "$GITHUB_REPOSITORY" --env staging --body jalwa-staging-media
          gh variable set R2_BACKUP_BUCKET --repo "$GITHUB_REPOSITORY" --env staging --body jalwa-staging-backups
          gh variable set SMTP_PORT --repo "$GITHUB_REPOSITORY" --env staging --body 587
          gh variable set SMTP_SECURE --repo "$GITHUB_REPOSITORY" --env staging --body false
          gh variable set STAGING_QA_CUSTOMER_EMAIL --repo "$GITHUB_REPOSITORY" --env staging --body acceptance+customer@watch-jalwa.com
          gh variable set STAGING_QA_ADMIN_EMAIL --repo "$GITHUB_REPOSITORY" --env staging --body acceptance+admin@watch-jalwa.com
          gh variable set STAGING_QA_RESTRICTED_EMAIL --repo "$GITHUB_REPOSITORY" --env staging --body acceptance+restricted@watch-jalwa.com
          gh variable set STAGING_QA_UNAUTHORIZED_EMAIL --repo "$GITHUB_REPOSITORY" --env staging --body acceptance+unauthorized@watch-jalwa.com
          gh variable set STAGING_QA_FINANCE_EMAIL --repo "$GITHUB_REPOSITORY" --env staging --body acceptance+finance@watch-jalwa.com
          gh variable set STAGING_QA_REPORT_VIEWER_EMAIL --repo "$GITHUB_REPOSITORY" --env staging --body acceptance+report-viewer@watch-jalwa.com
          gh variable set STAGING_EXPECT_PUBLIC_DOMAIN_LIVE_SOURCES --repo "$GITHUB_REPOSITORY" --env staging --body false
          gh variable set MINIMUM_STAGING_CONTENT_ITEMS --repo "$GITHUB_REPOSITORY" --env staging --body 1

          rm -f /tmp/jalwa-staging-key /tmp/jalwa-staging-key.pub /tmp/jalwa-backup-age.key
          echo 'Generated staging secrets and safe variables were stored without exposing their values.'
