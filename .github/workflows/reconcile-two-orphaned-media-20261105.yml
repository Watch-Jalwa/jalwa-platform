name: Jalwa - repair two orphaned demo media job records (guarded)

on:
  push:
    branches:
      - ops/jalwa-recover-two-stale-media-20261105
    paths:
      - .github/workflows/reconcile-two-orphaned-media-20261105.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate pinned existing internal-demo destination
        run: |
          set -Eeuo pipefail
          test "$USER" = codistan
          test "$APP_DIR" = /opt/codistan/jalwa-platform
          for key in HOST USER APP_DIR KNOWN_HOSTS SSH_KEY; do test -n "${!key:-}"; done
          for domain in watch-jalwa.com jalwa-platform.codistan.org; do
            curl -fsS --max-time 12 "https://$domain/api/health" |
              jq -e '.status=="ready"' >/dev/null
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=12 -i ~/.ssh/jalwa "$USER@$HOST" true
      - name: Prove worker is mock-payment demo on private R2
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker exec jalwa-worker-staging node -e 'const e=process.env;if(e.DEPLOYMENT_ENVIRONMENT!==\"staging\"||e.PAYMENT_PROVIDER!==\"mock\"||e.MEDIA_BACKEND!==\"r2\")process.exit(1);console.log(\"Demo boundary verified\")'"
      - name: Reconcile exact orphaned Sintel and VHS locks, preserving originals
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=12 -i ~/.ssh/jalwa "$USER@$HOST" 'bash -s' \
            < scripts/reconcile-two-orphaned-jalwa-media-20261105.sh | tee stale-media-reconciliation.log
          test "$(grep -c 'STALE_RECONCILED ' stale-media-reconciliation.log)" = 2
      - name: Verify both demo websites remain ready
        run: |
          set -Eeuo pipefail
          for domain in watch-jalwa.com jalwa-platform.codistan.org; do
            curl -fsS --max-time 12 "https://$domain/api/health" |
              jq -e '.status=="ready"' >/dev/null
            echo "DEMO_READY $domain"
          done
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jalwa-two-stale-job-recovery-${{ github.sha }}
          path: stale-media-reconciliation.log
          retention-days: 30
          if-no-files-found: warn
