name: Campaign analytics candidate tests
on:
  push:
    branches: [feat/campaign-analytics-admin-v1]
  pull_request:
    paths:
      - 'apps/web/lib/reports/campaign*'
      - 'apps/web/lib/studio/campaign*'
      - 'apps/web/app/studio/campaigns/**'
      - 'apps/web/app/api/studio/campaigns/**'
      - 'apps/web/tests/campaign*'
      - 'database/migrations/202611240001_campaign*'
      - '.github/workflows/campaign-analytics-qa.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Campaign unit tests
        run: node --test apps/web/tests/campaign-reporting.test.mjs apps/web/tests/campaign-xlsx.test.mjs
      - name: TypeScript validation
        run: npm run typecheck --workspace @jalwa/web
