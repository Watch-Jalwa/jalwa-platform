name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jalwa-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-web
  WORKER_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-worker

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_DOCKER_REF: ${{ vars.SUPABASE_DOCKER_REF }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_INCOMING_BUCKET: ${{ vars.R2_INCOMING_BUCKET }}
      R2_PROCESSED_BUCKET: ${{ vars.R2_PROCESSED_BUCKET }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
      MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
      RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
      RECOMMENDATION_REFRESH_SECRET: ${{ secrets.RECOMMENDATION_REFRESH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ACCOUNT_REQUEST_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_REQUEST_PROCESSOR_SECRET }}
      ACCOUNT_DELETION_HASH_SECRET: ${{ secrets.ACCOUNT_DELETION_HASH_SECRET }}
      OPERATIONS_DIAGNOSTICS_SECRET: ${{ secrets.OPERATIONS_DIAGNOSTICS_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.SELF_HOSTED_POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.SELF_HOSTED_SUPABASE_JWT_SECRET }}
      ANON_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_ANON_KEY }}
      SERVICE_ROLE_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_SERVICE_ROLE_KEY }}
      DASHBOARD_PASSWORD: ${{ secrets.SELF_HOSTED_SUPABASE_DASHBOARD_PASSWORD }}
      SECRET_KEY_BASE: ${{ secrets.SELF_HOSTED_SUPABASE_SECRET_KEY_BASE }}
      VAULT_ENC_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_VAULT_ENC_KEY }}
      PG_META_CRYPTO_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_PG_META_CRYPTO_KEY }}
      LOGFLARE_PUBLIC_TOKEN: ${{ secrets.SELF_HOSTED_SUPABASE_LOGFLARE_PUBLIC_TOKEN }}
      LOGFLARE_PRIVATE_TOKEN: ${{ secrets.SELF_HOSTED_SUPABASE_LOGFLARE_PRIVATE_TOKEN }}
      POOLER_TENANT_ID: ${{ secrets.SELF_HOSTED_SUPABASE_POOLER_TENANT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
      SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate isolated staging configuration
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Staging deploys must run from main.' >&2; exit 1; }
          required=(
            SUPABASE_DOCKER_REF STAGING_HOST STAGING_DOMAIN STAGING_SSH_KNOWN_HOSTS STAGING_SSH_KEY
            GHCR_USERNAME GHCR_DEPLOY_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_INCOMING_BUCKET R2_PROCESSED_BUCKET R2_BACKUP_BUCKET
            MEDIA_SIGNING_SECRET RATE_LIMIT_SALT RECOMMENDATION_REFRESH_SECRET CRON_SECRET
            ACCOUNT_REQUEST_PROCESSOR_SECRET ACCOUNT_DELETION_HASH_SECRET OPERATIONS_DIAGNOSTICS_SECRET
            DEEPSEEK_API_KEY PAYMENT_WEBHOOK_SECRET POSTGRES_PASSWORD JWT_SECRET ANON_KEY SERVICE_ROLE_KEY
            DASHBOARD_PASSWORD SECRET_KEY_BASE VAULT_ENC_KEY PG_META_CRYPTO_KEY LOGFLARE_PUBLIC_TOKEN
            LOGFLARE_PRIVATE_TOKEN POOLER_TENANT_ID SMTP_HOST SMTP_USER SMTP_PASS SMTP_ADMIN_EMAIL
            SMTP_SENDER_NAME BACKUP_AGE_IDENTITY
          )
          for name in "${required[@]}"; do test -n "${!name:-}" || { echo "Missing staging value $name" >&2; exit 1; }; done
          [[ "$SUPABASE_DOCKER_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'SUPABASE_DOCKER_REF must be a pinned commit SHA.' >&2; exit 1; }
          grep -q "$STAGING_HOST" <<<"$STAGING_SSH_KNOWN_HOSTS" || { echo 'Pinned SSH host key does not contain STAGING_HOST.' >&2; exit 1; }
          grep -q '^AGE-SECRET-KEY-' <<<"$BACKUP_AGE_IDENTITY" || { echo 'BACKUP_AGE_IDENTITY is not an age X25519 identity.' >&2; exit 1; }
          [[ "$R2_INCOMING_BUCKET" == jalwa-staging-* && "$R2_PROCESSED_BUCKET" == jalwa-staging-* && "$R2_BACKUP_BUCKET" == jalwa-staging-* ]] \
            || { echo 'Staging R2 buckets must use the jalwa-staging- prefix.' >&2; exit 1; }
          infrastructure/production/scripts/validate-production.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    needs: validate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable staging web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_SUPABASE_URL=https://api.${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SELF_HOSTED_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_ENABLE_PHONE_AUTH=false
            NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=false
            NEXT_PUBLIC_ENABLE_APPLE_AUTH=false
            NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=false
            NEXT_PUBLIC_ENABLE_LIVE_STREAMING=false
            NEXT_PUBLIC_ENABLE_WEB_DRM=false
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web
      - name: Build and push immutable staging worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: worker
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
          cache-from: type=gha,scope=staging-worker
          cache-to: type=gha,mode=max,scope=staging-worker

  media-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Deploy isolated staging media gateway
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infrastructure/media-gateway
          command: deploy --name jalwa-staging-media --domain media.${{ vars.STAGING_DOMAIN }}
          secrets: |
            MEDIA_SIGNING_SECRET
            MEDIA_GATEWAY_ALLOWED_ORIGINS
        env:
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          MEDIA_GATEWAY_ALLOWED_ORIGINS: https://${{ vars.STAGING_DOMAIN }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    needs: [build, media-gateway]
    env:
      HOST: ${{ vars.STAGING_HOST }}
      USER: ${{ vars.STAGING_USER || 'jalwa' }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
      SUPABASE_DOCKER_REF: ${{ vars.SUPABASE_DOCKER_REF }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Configure pinned staging SSH identity
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Generate staging runtime environments
        env:
          POSTGRES_PASSWORD: ${{ secrets.SELF_HOSTED_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.SELF_HOSTED_SUPABASE_JWT_SECRET }}
          ANON_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.SELF_HOSTED_SUPABASE_DASHBOARD_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SELF_HOSTED_SUPABASE_SECRET_KEY_BASE }}
          VAULT_ENC_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_VAULT_ENC_KEY }}
          PG_META_CRYPTO_KEY: ${{ secrets.SELF_HOSTED_SUPABASE_PG_META_CRYPTO_KEY }}
          LOGFLARE_PUBLIC_TOKEN: ${{ secrets.SELF_HOSTED_SUPABASE_LOGFLARE_PUBLIC_TOKEN }}
          LOGFLARE_PRIVATE_TOKEN: ${{ secrets.SELF_HOSTED_SUPABASE_LOGFLARE_PRIVATE_TOKEN }}
          POOLER_TENANT_ID: ${{ secrets.SELF_HOSTED_SUPABASE_POOLER_TENANT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_INCOMING_BUCKET: ${{ vars.R2_INCOMING_BUCKET }}
          R2_PROCESSED_BUCKET: ${{ vars.R2_PROCESSED_BUCKET }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          RECOMMENDATION_REFRESH_SECRET: ${{ secrets.RECOMMENDATION_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ACCOUNT_REQUEST_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_REQUEST_PROCESSOR_SECRET }}
          ACCOUNT_DELETION_HASH_SECRET: ${{ secrets.ACCOUNT_DELETION_HASH_SECRET }}
          OPERATIONS_DIAGNOSTICS_SECRET: ${{ secrets.OPERATIONS_DIAGNOSTICS_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/jalwa.env <<EOF
          NODE_ENV=production
          DEPLOYMENT_ENVIRONMENT=staging
          ALLOW_MOCK_PAYMENTS=true
          DOMAIN=$DOMAIN
          APP_URL=https://$DOMAIN
          NEXT_PUBLIC_APP_URL=https://$DOMAIN
          NEXT_PUBLIC_SUPABASE_URL=https://api.$DOMAIN
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          DATABASE_URL=postgresql://postgres:$POSTGRES_PASSWORD@supabase-db:5432/postgres
          AUTH_REDIRECT_URL=https://$DOMAIN/auth/callback
          NEXT_PUBLIC_ENABLE_PHONE_AUTH=false
          NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=false
          NEXT_PUBLIC_ENABLE_APPLE_AUTH=false
          NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=false
          NEXT_PUBLIC_ENABLE_LIVE_STREAMING=false
          NEXT_PUBLIC_ENABLE_WEB_DRM=false
          ENABLE_LIVE_STREAMING=false
          ENABLE_WEB_DRM=false
          R2_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_ENDPOINT=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com
          R2_INCOMING_BUCKET=$R2_INCOMING_BUCKET
          R2_PROCESSED_BUCKET=$R2_PROCESSED_BUCKET
          R2_BACKUP_BUCKET=$R2_BACKUP_BUCKET
          NEXT_PUBLIC_MEDIA_GATEWAY_URL=https://media.$DOMAIN
          MEDIA_SIGNING_SECRET=$MEDIA_SIGNING_SECRET
          MEDIA_GATEWAY_ALLOWED_ORIGINS=https://$DOMAIN
          RATE_LIMIT_SALT=$RATE_LIMIT_SALT
          CRON_SECRET=$CRON_SECRET
          RECOMMENDATION_REFRESH_SECRET=$RECOMMENDATION_REFRESH_SECRET
          ACCOUNT_REQUEST_PROCESSOR_SECRET=$ACCOUNT_REQUEST_PROCESSOR_SECRET
          ACCOUNT_DELETION_HASH_SECRET=$ACCOUNT_DELETION_HASH_SECRET
          OPERATIONS_DIAGNOSTICS_SECRET=$OPERATIONS_DIAGNOSTICS_SECRET
          WORKER_POLL_INTERVAL_MS=5000
          WORKER_HEARTBEAT_PATH=/tmp/jalwa-worker-heartbeat
          MEDIA_PROCESS_TIMEOUT_MS=7200000
          MEDIA_MAX_DURATION_SECONDS=43200
          OFFLINE_PUBLIC_TTL_SECONDS=604800
          BACKUP_LOCAL_RETENTION_DAYS=7
          BACKUP_REMOTE_RETENTION_DAYS=14
          AI_PROVIDER=deepseek
          AI_API_KEY=$DEEPSEEK_API_KEY
          AI_BASE_URL=https://api.deepseek.com
          AI_MODEL=deepseek-v4-flash
          AI_MODERATION_MODE=provider
          AI_MODERATION_MODEL=deepseek-v4-flash
          AI_MAX_OUTPUT_TOKENS=700
          AI_FREE_DAILY_LIMIT=20
          AI_PREMIUM_DAILY_LIMIT=100
          PAYMENT_PROVIDER=mock
          PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET
          PAYMENT_ADAPTER_TIMEOUT_MS=12000
          SENTRY_DSN=$SENTRY_DSN
          JALWA_IMAGE_TAG=${{ github.sha }}
          GIT_SHA=${{ github.sha }}
          EOF
          cat > /tmp/supabase.env <<EOF
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          ANON_KEY=$ANON_KEY
          SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          SUPABASE_PUBLISHABLE_KEY=$ANON_KEY
          SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY
          DASHBOARD_USERNAME=jalwa
          DASHBOARD_PASSWORD=$DASHBOARD_PASSWORD
          SECRET_KEY_BASE=$SECRET_KEY_BASE
          VAULT_ENC_KEY=$VAULT_ENC_KEY
          PG_META_CRYPTO_KEY=$PG_META_CRYPTO_KEY
          LOGFLARE_PUBLIC_ACCESS_TOKEN=$LOGFLARE_PUBLIC_TOKEN
          LOGFLARE_PRIVATE_ACCESS_TOKEN=$LOGFLARE_PRIVATE_TOKEN
          POOLER_TENANT_ID=$POOLER_TENANT_ID
          SUPABASE_PUBLIC_URL=https://api.$DOMAIN
          API_EXTERNAL_URL=https://api.$DOMAIN
          SITE_URL=https://$DOMAIN
          ADDITIONAL_REDIRECT_URLS=https://$DOMAIN/**
          PROXY_DOMAIN=api.$DOMAIN
          KONG_HTTP_PORT=127.0.0.1:8000
          KONG_HTTPS_PORT=127.0.0.1:8443
          ENABLE_EMAIL_SIGNUP=true
          ENABLE_EMAIL_AUTOCONFIRM=false
          SMTP_ADMIN_EMAIL=$SMTP_ADMIN_EMAIL
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_USER=$SMTP_USER
          SMTP_PASS=$SMTP_PASS
          SMTP_SENDER_NAME=$SMTP_SENDER_NAME
          ENABLE_PHONE_SIGNUP=false
          ENABLE_PHONE_AUTOCONFIRM=false
          GOOGLE_ENABLED=false
          APPLE_ENABLED=false
          FACEBOOK_ENABLED=false
          EOF
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > /tmp/backup-age.key

      - name: Copy staging configuration and backup identity
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/jalwa "$USER@$HOST" 'mkdir -p /opt/jalwa/scripts /opt/jalwa/systemd /opt/jalwa/migrations /opt/jalwa/supabase /opt/jalwa/backups/postgres /opt/jalwa/operations /opt/jalwa/secrets /opt/jalwa/deployments'
          scp -i ~/.ssh/jalwa infrastructure/production/docker-compose.yml infrastructure/production/Caddyfile "$USER@$HOST:/opt/jalwa/"
          scp -i ~/.ssh/jalwa infrastructure/production/scripts/*.sh "$USER@$HOST:/opt/jalwa/scripts/"
          scp -i ~/.ssh/jalwa infrastructure/production/systemd/* "$USER@$HOST:/opt/jalwa/systemd/"
          scp -i ~/.ssh/jalwa infrastructure/production/supabase/docker-compose.jalwa.yml "$USER@$HOST:/opt/jalwa/supabase/"
          scp -i ~/.ssh/jalwa supabase/migrations/*.sql "$USER@$HOST:/opt/jalwa/migrations/"
          scp -i ~/.ssh/jalwa /tmp/jalwa.env "$USER@$HOST:/opt/jalwa/.env.production"
          scp -i ~/.ssh/jalwa /tmp/supabase.env "$USER@$HOST:/opt/jalwa/.env.supabase"
          scp -i ~/.ssh/jalwa /tmp/backup-age.key "$USER@$HOST:/opt/jalwa/secrets/backup-age.key"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" 'chmod 600 /opt/jalwa/.env.production /opt/jalwa/.env.supabase /opt/jalwa/secrets/backup-age.key && chmod 700 /opt/jalwa/secrets && chmod 750 /opt/jalwa/scripts/*.sh'

      - name: Prepare data services and operations
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "SUPABASE_DOCKER_REF='$SUPABASE_DOCKER_REF' /opt/jalwa/scripts/prepare-supabase.sh"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "BACKUP_REASON=staging-pre-migration /opt/jalwa/scripts/backup-postgres.sh"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/apply-migrations.sh"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/install-operations.sh"

      - name: Deploy staging transactionally and verify recovery
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh -i ~/.ssh/jalwa "$USER@$HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/deploy-release.sh '${{ github.sha }}' '$DOMAIN'"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/capture-release-identity.sh '${{ github.sha }}' '${{ github.run_id }}'"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "BACKUP_REASON=staging-post-deploy /opt/jalwa/scripts/backup-postgres.sh"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/run-source-health.sh"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/run-account-requests.sh"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/restore-drill.sh"
          ssh -i ~/.ssh/jalwa "$USER@$HOST" "/opt/jalwa/scripts/host-acceptance.sh 'https://$DOMAIN' 'https://api.$DOMAIN'" | tee /tmp/staging-host-acceptance.json
          {
            echo '### Staging deployment passed host acceptance'
            echo "- URL: https://$DOMAIN"
            echo "- Release: ${{ github.sha }}"
            echo "- Deployment pipeline: ${{ github.run_id }}"
            echo '- Running web/worker image IDs, immutable registry digests and OCI revisions were captured for certification'
            echo '- Payment provider: isolated mock only'
            echo '- Live streaming and DRM: disabled'
            echo '- Backup encryption and restore drill: passed'
          } >> "$GITHUB_STEP_SUMMARY"
