name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jalwa-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-web
  WORKER_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-worker
  STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN || 'jalwa-platform.codistan.org' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate Codistan on-prem staging release boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Staging deploys must run from main.' >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APP_DIR" = /opt/codistan/jalwa-platform || { echo 'Managed Codistan staging root must remain /opt/codistan/jalwa-platform.' >&2; exit 1; }
          test "$USER" = codistan || { echo 'Codistan staging deploy user must remain codistan unless the server access model is deliberately migrated.' >&2; exit 1; }
          for name in HOST USER KNOWN_HOSTS SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing staging access value $name" >&2; exit 1; }
          done
          grep -Fq "$HOST" <<<"$KNOWN_HOSTS" || { echo 'Pinned SSH host key does not contain the staging host.' >&2; exit 1; }
          infrastructure/production/scripts/validate-production.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    needs: validate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push immutable staging web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
            NEXT_PUBLIC_APP_URL=https://${{ env.STAGING_DOMAIN }}
            NEXT_PUBLIC_ENABLE_PHONE_AUTH=false
            NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=false
            NEXT_PUBLIC_ENABLE_APPLE_AUTH=false
            NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=false
            NEXT_PUBLIC_ENABLE_LIVE_STREAMING=false
            NEXT_PUBLIC_ENABLE_WEB_DRM=false
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web
      - name: Build and push immutable staging worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: worker
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
          cache-from: type=gha,scope=staging-worker
          cache-to: type=gha,mode=max,scope=staging-worker

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN || 'jalwa-platform.codistan.org' }}
    needs: build
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      DOMAIN: ${{ vars.STAGING_DOMAIN || 'jalwa-platform.codistan.org' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure pinned on-prem SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Install canonical Codistan staging release assets
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "mkdir -p '$APP_DIR/scripts' '$APP_DIR/systemd' '$APP_DIR/migrations' '$APP_DIR/backups/postgres' '$APP_DIR/backups/config' '$APP_DIR/operations' '$APP_DIR/secrets' '$APP_DIR/deployments'"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "if test -s '$APP_DIR/docker-compose.staging.yml'; then cp -a '$APP_DIR/docker-compose.staging.yml' '$APP_DIR/backups/config/docker-compose.staging.yml.pre-${GITHUB_SHA}'; fi; if test -s '$APP_DIR/docker-compose.yml'; then cp -a '$APP_DIR/docker-compose.yml' '$APP_DIR/backups/config/docker-compose.yml.pre-${GITHUB_SHA}'; fi"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/docker-compose.yml "$USER@$HOST:$APP_DIR/docker-compose.yml"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/docker-compose.codistan-staging.yml "$USER@$HOST:$APP_DIR/docker-compose.codistan-staging.yml"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/scripts/*.sh "$USER@$HOST:$APP_DIR/scripts/"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/systemd/* "$USER@$HOST:$APP_DIR/systemd/"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa database/bootstrap.sql "$USER@$HOST:$APP_DIR/bootstrap.sql"
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa database/migrations/*.sql "$USER@$HOST:$APP_DIR/migrations/"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" "chmod 755 '$APP_DIR'/scripts/*.sh"

      - name: Authenticate host to immutable image registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy exact SHA while preserving existing PostgreSQL data
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "APP_DIR='$APP_DIR' DOMAIN='$DOMAIN' RELEASE_SHA='$GITHUB_SHA' BUILD_RUN_ID='$GITHUB_RUN_ID' DEPLOY_USER='$USER' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$APP_DIR/.env.staging"
          compose_file="$APP_DIR/docker-compose.yml:$APP_DIR/docker-compose.codistan-staging.yml"
          db_container=jalwa-postgres-staging
          expected_volume=jalwa-platform_jalwa_staging_pgdata
          expected_network=jalwa-platform_default
          test -s "$env_file" || { echo "Missing server-managed staging environment: $env_file" >&2; exit 1; }

          required=(DEPLOYMENT_ENVIRONMENT DATABASE_URL BETTER_AUTH_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_INCOMING_BUCKET R2_PROCESSED_BUCKET R2_BACKUP_BUCKET R2_ENDPOINT MEDIA_SIGNING_SECRET SMTP_HOST SMTP_USER SMTP_PASS BACKUP_AGE_IDENTITY)
          for name in "${required[@]}"; do
            grep -qE "^${name}=.+" "$env_file" || { echo "Missing server staging value $name" >&2; exit 1; }
          done
          grep -qx 'DEPLOYMENT_ENVIRONMENT=staging' "$env_file" || { echo 'DEPLOYMENT_ENVIRONMENT must be staging.' >&2; exit 1; }
          ! grep -qE '^SUPABASE_|^NEXT_PUBLIC_SUPABASE_' "$env_file" || { echo 'Legacy Supabase values remain in .env.staging.' >&2; exit 1; }

          docker inspect "$db_container" >/dev/null 2>&1 || { echo "Existing staging database container is missing: $db_container" >&2; exit 1; }
          [[ "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$db_container")" == jalwa-platform ]] || { echo 'Existing PostgreSQL container is not owned by the jalwa-platform Compose project.' >&2; exit 1; }
          [[ "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$db_container")" == postgres ]] || { echo 'Existing PostgreSQL container does not identify as the postgres service.' >&2; exit 1; }
          docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$db_container" | grep -qx "$expected_volume" \
            || { echo 'Existing PostgreSQL data volume does not match the approved staging volume.' >&2; exit 1; }
          docker network inspect "$expected_network" >/dev/null 2>&1 || { echo 'Existing Jalwa staging Docker network is missing.' >&2; exit 1; }
          docker exec "$db_container" pg_isready -U postgres -d postgres >/dev/null

          upsert_env() {
            local name="$1" value="$2" temporary
            temporary="$(mktemp "${env_file}.XXXXXX")"
            awk -v name="$name" -v value="$value" 'BEGIN{done=0} $0 ~ "^" name "=" {if(!done) print name "=" value; done=1; next} {print} END{if(!done) print name "=" value}' "$env_file" > "$temporary"
            chmod 600 "$temporary"
            mv -f "$temporary" "$env_file"
          }
          upsert_env NODE_ENV production
          upsert_env BETTER_AUTH_URL "https://$DOMAIN"
          upsert_env MEDIA_BACKEND r2
          upsert_env TRANSCODE_BACKEND ffmpeg
          upsert_env MEDIA_GATEWAY_MODE same-origin
          upsert_env PAYMENT_PROVIDER mock
          upsert_env ALLOW_MOCK_PAYMENTS true
          upsert_env NEXT_PUBLIC_FRONTEND_PREVIEW false
          upsert_env JALWA_WEB_PORT 3001
          upsert_env POSTGRES_IMAGE pgvector/pgvector:pg16
          upsert_env DB_CONTAINER "$db_container"
          upsert_env APP_DIR "$APP_DIR"
          upsert_env JALWA_ROOT "$APP_DIR"
          upsert_env JALWA_ENV_FILE "$env_file"
          upsert_env JALWA_COMPOSE_FILE "$compose_file"
          upsert_env ENV_FILE "$env_file"
          upsert_env BACKUP_DIR "$APP_DIR/backups/postgres"
          upsert_env BACKUP_AGE_IDENTITY_FILE "$APP_DIR/secrets/backup-age.key"
          upsert_env MIGRATIONS_DIR "$APP_DIR/migrations"
          upsert_env BOOTSTRAP_SQL "$APP_DIR/bootstrap.sql"
          upsert_env MIGRATION_LOCK_FILE "$APP_DIR/.migration.lock"

          if ! command -v jq >/dev/null || ! command -v age >/dev/null || ! command -v age-keygen >/dev/null || ! command -v aws >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq jq age awscli >/dev/null
          fi
          command -v docker >/dev/null
          docker compose version >/dev/null

          if [[ ! -s "$APP_DIR/secrets/backup-age.key" ]]; then
            identity="$(awk -F= '$1=="BACKUP_AGE_IDENTITY" {print substr($0,index($0,"=")+1); exit}' "$env_file")"
            [[ "$identity" == AGE-SECRET-KEY-* ]] || { echo 'Backup age identity file/value is missing.' >&2; exit 1; }
            printf '%s\n' "$identity" > "$APP_DIR/secrets/backup-age.key"
            chmod 600 "$APP_DIR/secrets/backup-age.key"
          fi

          export COMPOSE_PROJECT_NAME=jalwa-platform
          export COMPOSE_FILE="$compose_file"
          export JALWA_ROOT="$APP_DIR"
          export JALWA_ENV_FILE="$env_file"
          export JALWA_COMPOSE_FILE="$compose_file"
          export JALWA_COMPOSE_SERVICES='web worker'
          export JALWA_DEPLOY_NO_DEPS=true
          export JALWA_EXPECT_SERVICES='postgres web worker'
          export JALWA_SERVICE_USER="$DEPLOY_USER"
          export JALWA_SERVICE_GROUP="$DEPLOY_USER"
          export ENV_FILE="$env_file"
          export DB_CONTAINER="$db_container"
          export BACKUP_DIR="$APP_DIR/backups/postgres"
          export BACKUP_AGE_IDENTITY_FILE="$APP_DIR/secrets/backup-age.key"
          export MIGRATIONS_DIR="$APP_DIR/migrations"
          export BOOTSTRAP_SQL="$APP_DIR/bootstrap.sql"
          export MIGRATION_LOCK_FILE="$APP_DIR/.migration.lock"

          cd "$APP_DIR"
          docker compose --env-file "$env_file" config --quiet
          docker compose --env-file "$env_file" config --images | grep -Fxq 'pgvector/pgvector:pg16'
          docker compose --env-file "$env_file" config | grep -Fq 'jalwa-platform_jalwa_staging_pgdata'
          docker compose --env-file "$env_file" config | grep -Fq 'jalwa-platform_default'

          BACKUP_REASON="pre-deploy-${RELEASE_SHA:0:12}" "$APP_DIR/scripts/backup-postgres.sh"
          ALLOW_LEGACY_MIGRATION_BASELINE=true MIGRATION_BASELINE_LOCK_FILE="$APP_DIR/.migration-baseline.lock" "$APP_DIR/scripts/reconcile-legacy-migration-ledger.sh"
          "$APP_DIR/scripts/apply-migrations.sh"
          "$APP_DIR/scripts/deploy-release.sh" "$RELEASE_SHA" "$DOMAIN"
          JALWA_ENV_FILE="$env_file" JALWA_ROOT="$APP_DIR" JALWA_SERVICE_USER="$DEPLOY_USER" JALWA_SERVICE_GROUP="$DEPLOY_USER" "$APP_DIR/scripts/install-operations.sh"
          BACKUP_REASON="post-deploy-${RELEASE_SHA:0:12}" "$APP_DIR/scripts/backup-postgres.sh"
          "$APP_DIR/scripts/restore-drill.sh"
          APP_DIR="$APP_DIR" DB_CONTAINER="$db_container" "$APP_DIR/scripts/host-acceptance.sh" "https://$DOMAIN"
          "$APP_DIR/scripts/capture-release-identity.sh" "$RELEASE_SHA" "$BUILD_RUN_ID" "$BUILD_RUN_ID"
          docker logout ghcr.io >/dev/null 2>&1 || true
          REMOTE

      - name: Verify public exact-release health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 30 "https://$DOMAIN/api/health")"
          readiness="$(curl -fsS --max-time 30 "https://$DOMAIN/api/readiness")"
          jq -e --arg sha "$GITHUB_SHA" '.status == "ready" and .version == $sha' <<<"$health" >/dev/null
          jq -e --arg sha "$GITHUB_SHA" '.status == "ready" and .database == "ready" and .version == $sha' <<<"$readiness" >/dev/null

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '### Codistan on-prem staging deployed'
            echo "- Domain: https://$DOMAIN"
            echo "- Exact SHA: $GITHUB_SHA"
            echo "- Deployment run: $GITHUB_RUN_ID"
            echo '- Host: existing Codistan on-prem server (pinned SSH as codistan)'
            echo '- Managed root: /opt/codistan/jalwa-platform'
            echo '- PostgreSQL: existing pgvector/pg16 container and existing pgdata volume preserved'
            echo '- Reverse proxy: existing host nginx on Jalwa host port 3001; repository Caddy is not started'
            echo '- Media: private R2 + FFmpeg + same-origin signed /api/media gateway'
            echo '- Payments: mock-only staging boundary enforced'
            echo '- Backups: encrypted pre/post-deploy backup and restore drill executed'
            echo '- Next: Staging certification workflow runs automatically for this exact SHA'
          } >> "$GITHUB_STEP_SUMMARY"
