name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jalwa-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-web
  WORKER_IMAGE: ghcr.io/watch-jalwa/jalwa-platform-worker

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_INCOMING_BUCKET: ${{ vars.R2_INCOMING_BUCKET }}
      R2_PROCESSED_BUCKET: ${{ vars.R2_PROCESSED_BUCKET }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
      MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
      RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
      RECOMMENDATION_REFRESH_SECRET: ${{ secrets.RECOMMENDATION_REFRESH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ACCOUNT_REQUEST_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_REQUEST_PROCESSOR_SECRET }}
      ACCOUNT_DELETION_HASH_SECRET: ${{ secrets.ACCOUNT_DELETION_HASH_SECRET }}
      OPERATIONS_DIAGNOSTICS_SECRET: ${{ secrets.OPERATIONS_DIAGNOSTICS_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.SELF_HOSTED_POSTGRES_PASSWORD }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      STAGING_QA_SECRET: ${{ secrets.STAGING_QA_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
      SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate isolated staging configuration
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Staging deploys must run from main.' >&2; exit 1; }
          required=(
            STAGING_HOST STAGING_DOMAIN STAGING_SSH_KNOWN_HOSTS STAGING_SSH_KEY
            GHCR_USERNAME GHCR_DEPLOY_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_INCOMING_BUCKET R2_PROCESSED_BUCKET R2_BACKUP_BUCKET
            MEDIA_SIGNING_SECRET RATE_LIMIT_SALT RECOMMENDATION_REFRESH_SECRET CRON_SECRET
            ACCOUNT_REQUEST_PROCESSOR_SECRET ACCOUNT_DELETION_HASH_SECRET OPERATIONS_DIAGNOSTICS_SECRET
            DEEPSEEK_API_KEY PAYMENT_WEBHOOK_SECRET POSTGRES_PASSWORD BETTER_AUTH_SECRET STAGING_QA_SECRET
            SMTP_HOST SMTP_USER SMTP_PASS SMTP_ADMIN_EMAIL SMTP_SENDER_NAME BACKUP_AGE_IDENTITY
          )
          for name in "${required[@]}"; do test -n "${!name:-}" || { echo "Missing staging value $name" >&2; exit 1; }; done
          test ${#BETTER_AUTH_SECRET} -ge 32
          test ${#STAGING_QA_SECRET} -ge 32
          grep -q "$STAGING_HOST" <<<"$STAGING_SSH_KNOWN_HOSTS" || { echo 'Pinned SSH host key does not contain STAGING_HOST.' >&2; exit 1; }
          grep -q '^AGE-SECRET-KEY-' <<<"$BACKUP_AGE_IDENTITY" || { echo 'BACKUP_AGE_IDENTITY is not an age X25519 identity.' >&2; exit 1; }
          [[ "$R2_INCOMING_BUCKET" == jalwa-staging-* && "$R2_PROCESSED_BUCKET" == jalwa-staging-* && "$R2_BACKUP_BUCKET" == jalwa-staging-* ]] \
            || { echo 'Staging R2 buckets must use the jalwa-staging- prefix.' >&2; exit 1; }
          infrastructure/production/scripts/validate-production.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    needs: validate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable staging web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
            NEXT_PUBLIC_APP_URL=https://${{ vars.STAGING_DOMAIN }}
            NEXT_PUBLIC_ENABLE_PHONE_AUTH=false
            NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=false
            NEXT_PUBLIC_ENABLE_APPLE_AUTH=false
            NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=false
            NEXT_PUBLIC_ENABLE_LIVE_STREAMING=false
            NEXT_PUBLIC_ENABLE_WEB_DRM=false
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web
      - name: Build and push immutable staging worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: worker
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
          cache-from: type=gha,scope=staging-worker
          cache-to: type=gha,mode=max,scope=staging-worker

  media-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Deploy isolated staging media gateway
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infrastructure/media-gateway
          command: deploy --name jalwa-staging-media --domain media.${{ vars.STAGING_DOMAIN }}
          secrets: |
            MEDIA_SIGNING_SECRET
            MEDIA_GATEWAY_ALLOWED_ORIGINS
        env:
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          MEDIA_GATEWAY_ALLOWED_ORIGINS: https://${{ vars.STAGING_DOMAIN }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    needs: [build, media-gateway]
    env:
      HOST: ${{ vars.STAGING_HOST }}
      USER: ${{ vars.STAGING_USER || 'jalwa' }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Configure pinned staging SSH identity
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Generate direct PostgreSQL staging environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.SELF_HOSTED_POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          STAGING_QA_SECRET: ${{ secrets.STAGING_QA_SECRET }}
          STAGING_QA_ALLOWED_EMAILS: ${{ vars.STAGING_QA_ALLOWED_EMAILS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_INCOMING_BUCKET: ${{ vars.R2_INCOMING_BUCKET }}
          R2_PROCESSED_BUCKET: ${{ vars.R2_PROCESSED_BUCKET }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          OBSERVABILITY_HASH_SALT: ${{ secrets.OBSERVABILITY_HASH_SALT }}
          OPERATIONS_DIAGNOSTICS_SECRET: ${{ secrets.OPERATIONS_DIAGNOSTICS_SECRET }}
          RECOMMENDATION_REFRESH_SECRET: ${{ secrets.RECOMMENDATION_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ACCOUNT_REQUEST_PROCESSOR_SECRET: ${{ secrets.ACCOUNT_REQUEST_PROCESSOR_SECRET }}
          ACCOUNT_DELETION_HASH_SECRET: ${{ secrets.ACCOUNT_DELETION_HASH_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          cat > /tmp/jalwa.env <<EOF
          NODE_ENV=production
          DEPLOYMENT_ENVIRONMENT=staging
          DOMAIN=$DOMAIN
          APP_URL=https://$DOMAIN
          NEXT_PUBLIC_APP_URL=https://$DOMAIN
          NEXT_PUBLIC_FRONTEND_PREVIEW=false
          NEXT_PUBLIC_STAGING=true
          POSTGRES_DB=postgres
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql://postgres:$POSTGRES_PASSWORD@postgres:5432/postgres
          BETTER_AUTH_URL=https://$DOMAIN
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          STAGING_QA_SECRET=$STAGING_QA_SECRET
          STAGING_QA_ALLOWED_EMAILS=$STAGING_QA_ALLOWED_EMAILS
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_SECURE=$SMTP_SECURE
          SMTP_USER=$SMTP_USER
          SMTP_PASSWORD=$SMTP_PASS
          SMTP_FROM=$SMTP_SENDER_NAME <$SMTP_ADMIN_EMAIL>
          NEXT_PUBLIC_ENABLE_PHONE_AUTH=false
          NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=false
          NEXT_PUBLIC_ENABLE_APPLE_AUTH=false
          NEXT_PUBLIC_ENABLE_FACEBOOK_AUTH=false
          NEXT_PUBLIC_ENABLE_LIVE_STREAMING=false
          NEXT_PUBLIC_ENABLE_WEB_DRM=false
          ENABLE_LIVE_STREAMING=false
          PUBLIC_DOMAIN_LIVE_SOURCES_ENABLED=false
          ENABLE_WEB_DRM=false
          R2_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_ENDPOINT=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com
          R2_INCOMING_BUCKET=$R2_INCOMING_BUCKET
          R2_PROCESSED_BUCKET=$R2_PROCESSED_BUCKET
          R2_BACKUP_BUCKET=$R2_BACKUP_BUCKET
          NEXT_PUBLIC_MEDIA_GATEWAY_URL=https://media.$DOMAIN
          MEDIA_SIGNING_SECRET=$MEDIA_SIGNING_SECRET
          MEDIA_GATEWAY_ALLOWED_ORIGINS=https://$DOMAIN
          RATE_LIMIT_SALT=$RATE_LIMIT_SALT
          OBSERVABILITY_HASH_SALT=$OBSERVABILITY_HASH_SALT
          OPERATIONS_DIAGNOSTICS_SECRET=$OPERATIONS_DIAGNOSTICS_SECRET
          RECOMMENDATION_REFRESH_SECRET=$RECOMMENDATION_REFRESH_SECRET
          CRON_SECRET=$CRON_SECRET
          ACCOUNT_REQUEST_PROCESSOR_SECRET=$ACCOUNT_REQUEST_PROCESSOR_SECRET
          ACCOUNT_DELETION_HASH_SECRET=$ACCOUNT_DELETION_HASH_SECRET
          AI_ENABLED=true
          AI_PROVIDER=deepseek
          AI_API_KEY=$DEEPSEEK_API_KEY
          AI_BASE_URL=https://api.deepseek.com
          AI_MODEL=deepseek-v4-flash
          AI_MODERATION_MODE=provider
          AI_MODERATION_MODEL=deepseek-v4-flash
          PAYMENT_PROVIDER=mock
          PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET
          ALLOW_MOCK_PAYMENTS=true
          JALWA_IMAGE_TAG=${{ github.sha }}
          GIT_SHA=${{ github.sha }}
          BUILD_RUN_ID=${{ github.run_id }}
          EOF
          chmod 600 /tmp/jalwa.env

      - name: Install staging release assets
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            'mkdir -p /opt/jalwa/scripts /opt/jalwa/systemd /opt/jalwa/migrations /opt/jalwa/backups/postgres /opt/jalwa/operations /opt/jalwa/secrets /opt/jalwa/deployments'
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/docker-compose.yml "$USER@$HOST:/opt/jalwa/docker-compose.yml"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/Caddyfile "$USER@$HOST:/opt/jalwa/Caddyfile"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/scripts/*.sh "$USER@$HOST:/opt/jalwa/scripts/"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa infrastructure/production/systemd/* "$USER@$HOST:/opt/jalwa/systemd/"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa database/bootstrap.sql "$USER@$HOST:/opt/jalwa/bootstrap.sql"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa database/migrations/*.sql "$USER@$HOST:/opt/jalwa/migrations/"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa /tmp/jalwa.env "$USER@$HOST:/opt/jalwa/.env.production"
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > /tmp/backup-age.key
          chmod 600 /tmp/backup-age.key
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa /tmp/backup-age.key "$USER@$HOST:/opt/jalwa/secrets/backup-age.key"
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin >/dev/null"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            'chmod 600 /opt/jalwa/.env.production /opt/jalwa/secrets/backup-age.key && chmod 750 /opt/jalwa/scripts/*.sh'

      - name: Apply migrations and deploy exact release
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" "set -euo pipefail
            cd /opt/jalwa
            docker compose --env-file .env.production config --quiet
            docker compose --env-file .env.production up -d postgres --wait
            ./scripts/apply-migrations.sh
            ./scripts/install-operations.sh
            ./scripts/deploy-release.sh '${{ github.sha }}' '$DOMAIN'
            ./scripts/capture-release-identity.sh '${{ github.sha }}' '${{ github.run_id }}'
            BACKUP_REASON=staging-deploy ./scripts/backup-postgres.sh
            ./scripts/restore-drill.sh
            ./scripts/host-acceptance.sh 'https://$DOMAIN'"

      - name: Deployment summary
        run: |
          {
            echo '### Staging deployment passed'
            echo '- Release: `${{ github.sha }}`'
            echo '- Build run: `${{ github.run_id }}`'
            echo '- Architecture: direct PostgreSQL + Better Auth + SMTP + R2'
            echo '- Mock payments: enabled only for staging'
            echo '- Encrypted backup and restore drill: passed'
          } >> "$GITHUB_STEP_SUMMARY"
