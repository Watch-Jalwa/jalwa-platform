name: Supabase removal audit

on:
  push:
    branches: [chore/permanent-staging-certification]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Inventory Supabase runtime coupling
        shell: bash
        run: |
          set -euo pipefail
          echo '=== app/package/workflow Supabase references ==='
          rg -n --hidden --glob '!node_modules/**' --glob '!package-lock.json' 'supabase|SUPABASE' apps scripts infrastructure .github qa package.json .env.example README.md docs || true
          echo '=== migration auth schema/JWT/RLS references ==='
          rg -n 'auth\.|auth\(|authenticated|service_role|request\.jwt|jwt' supabase/migrations || true
