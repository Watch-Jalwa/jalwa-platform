name: Temporary source bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    if: github.head_ref == 'chore/permanent-staging-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Create sanitized source bundle
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude='*.env' --exclude='.env*' -czf /tmp/jalwa-source.tgz .
      - name: Upload source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jalwa-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/jalwa-source.tgz
          retention-days: 1
          if-no-files-found: error
