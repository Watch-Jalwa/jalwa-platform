name: Set internal alpha state

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment
        required: true
        type: choice
        options:
          - staging
          - production
      enabled:
        description: Desired internal-alpha state
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      minimum_available_content:
        description: Minimum rights-cleared, published and playable items
        required: true
        type: number
        default: 1
      release_sha:
        description: Exact deployed 40-character main commit SHA
        required: true
        type: string
      approval_reference:
        description: Issue #59 rollout evidence; production enablement requires an issue #59 URL
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: jalwa-${{ inputs.target_environment }}-internal-alpha
  cancel-in-progress: false

jobs:
  change-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target_environment }}
      url: ${{ inputs.target_environment == 'staging' && format('https://{0}', vars.STAGING_DOMAIN) || format('https://{0}', vars.PRODUCTION_DOMAIN) }}
    env:
      TARGET_ENV: ${{ inputs.target_environment }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DESIRED_STATE: ${{ inputs.enabled }}
      INVITE_ONLY: "true"
      MINIMUM_CONTENT: ${{ inputs.minimum_available_content }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      HOST: ${{ inputs.target_environment == 'staging' && vars.STAGING_HOST || vars.PRODUCTION_HOST }}
      USER: ${{ inputs.target_environment == 'staging' && (vars.STAGING_USER || 'jalwa') || (vars.PRODUCTION_USER || 'jalwa') }}
      DOMAIN: ${{ inputs.target_environment == 'staging' && vars.STAGING_DOMAIN || vars.PRODUCTION_DOMAIN }}
      SSH_KEY: ${{ inputs.target_environment == 'staging' && secrets.STAGING_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
      KNOWN_HOSTS: ${{ inputs.target_environment == 'staging' && vars.STAGING_SSH_KNOWN_HOSTS || vars.PRODUCTION_SSH_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate request
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TARGET_ENV" == staging || "$TARGET_ENV" == production ]]
          [[ "$DESIRED_STATE" == true || "$DESIRED_STATE" == false ]]
          test "$INVITE_ONLY" = true
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MINIMUM_CONTENT" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test -n "$HOST" && test -n "$DOMAIN" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          test -n "$APPROVAL_REFERENCE" && [[ ${#APPROVAL_REFERENCE} -le 500 ]]
          [[ "$APPROVAL_REFERENCE" != *$'\n'* ]]
          if [[ "$TARGET_ENV" == production && "$DESIRED_STATE" == true ]]; then
            [[ "$APPROVAL_REFERENCE" == https://github.com/Watch-Jalwa/jalwa-platform/issues/59* ]] || {
              echo 'Production alpha enablement requires issue #59 staging evidence.' >&2
              exit 1
            }
          fi

      - name: Configure pinned SSH identity
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Apply database state
        id: state
        run: |
          set -euo pipefail
          echo "attempted_enable=$DESIRED_STATE" >> "$GITHUB_OUTPUT"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker exec -i jalwa-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
              -v deployment_environment='$TARGET_ENV' \
              -v desired_state='$DESIRED_STATE' \
              -v invite_only='$INVITE_ONLY' \
              -v minimum_available_content='$MINIMUM_CONTENT'" \
            < scripts/set-internal-alpha-state.sql

      - name: Verify exact release and public health
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 20 "https://$DOMAIN/api/health")"
          test "$(jq -r '.version // empty' <<<"$health")" = "$RELEASE_SHA"
          curl --fail --silent --show-error --max-time 20 "https://$DOMAIN/" >/dev/null
          curl --fail --silent --show-error --max-time 20 "https://$DOMAIN/explore" >/dev/null

      - name: Roll back failed enablement
        if: failure() && steps.state.outputs.attempted_enable == 'true'
        run: |
          set +e
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker exec -i jalwa-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
              -v deployment_environment='$TARGET_ENV' \
              -v desired_state=false \
              -v invite_only=true \
              -v minimum_available_content=0" \
            < scripts/set-internal-alpha-state.sql

      - name: Record state change
        if: success()
        run: |
          gh issue comment 59 --repo "$GITHUB_REPOSITORY" --body \
            "Internal alpha state updated: environment \`$TARGET_ENV\`, enabled \`$DESIRED_STATE\`, invite-only \`$INVITE_ONLY\`, minimum content \`$MINIMUM_CONTENT\`, release \`$RELEASE_SHA\`. Evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Approval reference: $APPROVAL_REFERENCE"

      - name: Record failure
        if: failure()
        run: |
          gh issue comment 59 --repo "$GITHUB_REPOSITORY" --body \
            "Internal alpha state change failed for \`$TARGET_ENV\` at release \`$RELEASE_SHA\`. Attempted enablement was rolled back. Evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summarize
        if: success()
        run: |
          {
            echo '### Internal alpha'
            echo "- Environment: $TARGET_ENV"
            echo "- Enabled: $DESIRED_STATE"
            echo "- Invite only: $INVITE_ONLY"
            echo "- Minimum available content: $MINIMUM_CONTENT"
            echo "- Release: $RELEASE_SHA"
            echo '- Database source, rights, playback and availability invariants passed.'
          } >> "$GITHUB_STEP_SUMMARY"
