name: Set approved live sources

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to change
        required: true
        type: choice
        options:
          - staging
          - production
      enabled:
        description: Desired approved live-source state
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      release_sha:
        description: Exact deployed 40-character main commit SHA
        required: true
        type: string
      approval_reference:
        description: Issue #52 evidence or approval reference; production enablement requires an issue #52 URL
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: jalwa-${{ inputs.target_environment }}-approved-live-sources
  cancel-in-progress: false

jobs:
  change-state:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.target_environment }}
      url: ${{ inputs.target_environment == 'staging' && format('https://{0}', vars.STAGING_DOMAIN) || format('https://{0}', vars.PRODUCTION_DOMAIN) }}
    env:
      TARGET_ENV: ${{ inputs.target_environment }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DESIRED_STATE: ${{ inputs.enabled }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      HOST: ${{ inputs.target_environment == 'staging' && vars.STAGING_HOST || vars.PRODUCTION_HOST }}
      USER: ${{ inputs.target_environment == 'staging' && (vars.STAGING_USER || 'jalwa') || (vars.PRODUCTION_USER || 'jalwa') }}
      DOMAIN: ${{ inputs.target_environment == 'staging' && vars.STAGING_DOMAIN || vars.PRODUCTION_DOMAIN }}
      SSH_KEY: ${{ inputs.target_environment == 'staging' && secrets.STAGING_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
      KNOWN_HOSTS: ${{ inputs.target_environment == 'staging' && vars.STAGING_SSH_KNOWN_HOSTS || vars.PRODUCTION_SSH_KNOWN_HOSTS }}
      REPORT_FILE: ${{ github.workspace }}/public-domain-live-acceptance.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate activation request
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Activation must be dispatched from main.' >&2; exit 1; }
          [[ "$TARGET_ENV" == staging || "$TARGET_ENV" == production ]]
          [[ "$DESIRED_STATE" == true || "$DESIRED_STATE" == false ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A 40-character release SHA is required.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'Release SHA is not on main.' >&2; exit 1; }
          test -n "$HOST" && test -n "$DOMAIN" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Host contains unsupported characters.' >&2; exit 1; }
          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Domain contains unsupported characters.' >&2; exit 1; }
          [[ "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Deployment user contains unsupported characters.' >&2; exit 1; }
          test -n "$APPROVAL_REFERENCE" && [[ ${#APPROVAL_REFERENCE} -le 500 ]]
          [[ "$APPROVAL_REFERENCE" != *$'\n'* ]]
          if [[ "$TARGET_ENV" == production && "$DESIRED_STATE" == true ]]; then
            [[ "$APPROVAL_REFERENCE" == https://github.com/Watch-Jalwa/jalwa-platform/issues/52* ]] || {
              echo 'Production enablement requires an issue #52 staging-observation approval reference.' >&2
              exit 1
            }
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: env.DESIRED_STATE == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned live-source acceptance harness
        if: env.DESIRED_STATE == 'true'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.61.1
          npx playwright install --with-deps chromium

      - name: Configure pinned SSH identity
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Apply controlled catalogue and runtime state
        id: toggle
        run: |
          set -euo pipefail
          echo "attempted_enable=$DESIRED_STATE" >> "$GITHUB_OUTPUT"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa \
            infrastructure/production/scripts/set-public-domain-live-sources.sh \
            "$USER@$HOST:/tmp/set-public-domain-live-sources.sh"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "install -m 750 /tmp/set-public-domain-live-sources.sh /opt/jalwa/scripts/set-public-domain-live-sources.sh && rm -f /tmp/set-public-domain-live-sources.sh"

          set_database_state() {
            local state="$1"
            ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
              "docker exec -i jalwa-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -v deployment_environment='$TARGET_ENV' -v desired_state='$state'" \
              < scripts/set-public-domain-live-catalogue-state.sql
          }

          if [[ "$DESIRED_STATE" == true ]]; then
            set_database_state true
            ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
              "/opt/jalwa/scripts/set-public-domain-live-sources.sh true '$RELEASE_SHA' '$DOMAIN' '$TARGET_ENV'"
          else
            ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
              "/opt/jalwa/scripts/set-public-domain-live-sources.sh false '$RELEASE_SHA' '$DOMAIN' '$TARGET_ENV'"
            set_database_state false
          fi
          echo "state=$DESIRED_STATE" >> "$GITHUB_OUTPUT"

      - name: Run mobile and source acceptance
        if: env.DESIRED_STATE == 'true'
        env:
          JALWA_BROWSER_BASE_URL: https://${{ env.DOMAIN }}
          JALWA_EXPECTED_VERSION: ${{ env.RELEASE_SHA }}
          JALWA_PUBLIC_DOMAIN_LIVE_REPORT_FILE: ${{ env.REPORT_FILE }}
        run: node scripts/public-domain-live-acceptance.mjs

      - name: Roll back failed enablement
        if: failure() && steps.toggle.outputs.attempted_enable == 'true'
        run: |
          set +e
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "/opt/jalwa/scripts/set-public-domain-live-sources.sh false '$RELEASE_SHA' '$DOMAIN' '$TARGET_ENV'"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "docker exec -i jalwa-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -v deployment_environment='$TARGET_ENV' -v desired_state=false" \
            < scripts/set-public-domain-live-catalogue-state.sql
          if [[ "$TARGET_ENV" == staging ]]; then
            gh variable set STAGING_EXPECT_PUBLIC_DOMAIN_LIVE_SOURCES --env staging --body false
          fi

      - name: Persist staging expectation
        if: success() && env.TARGET_ENV == 'staging'
        run: gh variable set STAGING_EXPECT_PUBLIC_DOMAIN_LIVE_SOURCES --env staging --body "$DESIRED_STATE"

      - name: Record successful state change
        if: success()
        run: |
          cat > /tmp/issue-comment.md <<EOF
          ## ${TARGET_ENV^} approved live catalogue state updated

          - State: \`$DESIRED_STATE\`
          - Release: \`$RELEASE_SHA\`
          - Environment: \`$TARGET_ENV\`
          - Earliest rights review recorded: \`2026-08-01T09:51:00Z\`
          - Next mandatory terms review: \`2026-10-30T09:51:00Z\`
          - Underlying approved items: 52
          - User-facing inventory: 46
          - Approval/evidence reference: $APPROVAL_REFERENCE
          - Actor: \`${{ github.actor }}\`
          - Workflow evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          $([[ "$DESIRED_STATE" == true ]] && echo 'All 52 underlying records, 44 direct entries and two collections were database-published and enabled before source-health and mobile acceptance.' || echo 'The global flag, source configurations, content items and collections are fail-closed.')
          EOF
          gh issue comment 52 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md

      - name: Record failed state change
        if: failure()
        run: |
          gh issue comment 52 --repo "$GITHUB_REPOSITORY" --body \
            "${TARGET_ENV^} approved live catalogue state change failed for release \`$RELEASE_SHA\`. Enablement was rolled back when it was attempted. Evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summarize state
        if: success()
        run: |
          {
            echo '### Approved live catalogue state'
            echo "- Environment: $TARGET_ENV"
            echo "- Enabled: $DESIRED_STATE"
            echo "- Release: $RELEASE_SHA"
            echo '- Underlying approved items: 52'
            echo '- User-facing inventory: 46'
            echo '- Delivery split: 23 secured current images, 22 official links, 7 official embeds'
            echo '- Rights review expires: 2026-10-30T09:51:00Z'
            if [[ "$DESIRED_STATE" == true ]]; then
              echo '- Database publication, provider-aware health and 390×844 reduced-motion browser acceptance passed'
              echo '```json'
              cat "$REPORT_FILE"
              echo '```'
            else
              echo '- Runtime and database catalogue are fail-closed'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
