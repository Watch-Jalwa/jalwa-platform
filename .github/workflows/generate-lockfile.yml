name: Verify dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify the committed lockfile is reproducible
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.committed.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp --silent /tmp/package-lock.committed.json package-lock.json || {
            echo 'package-lock.json is not reproducible from the committed package manifests.' >&2
            git diff -- package-lock.json
            exit 1
          }
      - name: Verify actual locked package paths
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const versions = (name) => [...new Set(Object.entries(lock.packages)
            .filter(([path, value]) => value && (path === `node_modules/${name}` || path.endsWith(`/node_modules/${name}`)))
            .map(([, value]) => value.version))];
          const resolved = { next: versions('next'), postcss: versions('postcss'), sharp: versions('sharp') };
          console.log(resolved);
          if (resolved.next.length !== 1 || resolved.next[0] !== '16.2.12') process.exit(1);
          if (resolved.postcss.some((version) => version !== '8.5.22')) process.exit(1);
          if (resolved.sharp.some((version) => version !== '0.35.3')) process.exit(1);
          NODE
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
