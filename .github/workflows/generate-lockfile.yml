name: Verify dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify the committed lockfile is reproducible
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.committed.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp --silent /tmp/package-lock.committed.json package-lock.json || {
            echo 'package-lock.json is not reproducible from the committed package manifests.' >&2
            git diff -- package-lock.json
            exit 1
          }
      - name: Verify patched dependency versions
        run: |
          node -e "const lock=require('./package-lock.json'); const values=Object.values(lock.packages); const versions=n=>[...new Set(values.filter(v=>v&&v.name===n).map(v=>v.version))]; console.log({next:versions('next'),postcss:versions('postcss'),sharp:versions('sharp')}); if(versions('next').some(v=>v!=='16.2.12')||versions('postcss').some(v=>v!=='8.5.22')||versions('sharp').some(v=>v!=='0.35.3')) process.exit(1)"
