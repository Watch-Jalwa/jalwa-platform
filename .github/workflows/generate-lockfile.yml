name: Refresh deployment lockfile

on:
  push:
    branches:
      - agent/production-lifecycle-hardening
    paths:
      - package.json
      - apps/web/package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

concurrency:
  group: jalwa-lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/production-lifecycle-hardening
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Correct the recommendation publication column
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/202607310001_social_recommendations.sql')
          text = path.read_text()
          count = text.count('c.published_at')
          if count != 2:
              raise SystemExit(f'Expected exactly two c.published_at references, found {count}.')
          path.write_text(text.replace('c.published_at', 'c.publish_at'))
          PY
      - name: Re-resolve the full dependency graph
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify actual locked package paths
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const versions = (name) => [...new Set(Object.entries(lock.packages)
            .filter(([path, value]) => value && (path === `node_modules/${name}` || path.endsWith(`/node_modules/${name}`)))
            .map(([, value]) => value.version))];
          const resolved = { next: versions('next'), postcss: versions('postcss'), sharp: versions('sharp') };
          console.log(resolved);
          if (resolved.next.length !== 1 || resolved.next[0] !== '16.2.12') process.exit(1);
          if (resolved.postcss.some((version) => version !== '8.5.22')) process.exit(1);
          if (resolved.sharp.some((version) => version !== '0.35.3')) process.exit(1);
          NODE
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit deterministic corrections
        run: |
          set -euo pipefail
          git add package-lock.json supabase/migrations/202607310001_social_recommendations.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild patched dependencies and fix recommendation publication dates'
          git push origin HEAD:agent/production-lifecycle-hardening
