name: Verify dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify the committed lockfile is reproducible
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.committed.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp --silent /tmp/package-lock.committed.json package-lock.json || {
            echo 'package-lock.json is not reproducible from the committed package manifests.' >&2
            git diff -- package-lock.json
            exit 1
          }
