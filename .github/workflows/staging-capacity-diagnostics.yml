name: Staging capacity diagnostics

on:
  push:
    branches: ["ops/jalwa-staging-capacity-diagnostics"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Configure pinned staging SSH identity
        run: |
          set -euo pipefail
          test "$USER" = codistan
          test "$APP_DIR" = /opt/codistan/jalwa-platform
          test -n "$HOST" && test -n "$KNOWN_HOSTS" && test -n "$SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Guarded ext4 reserve normalization
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" \
            "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          usage_before="$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          echo "Root filesystem usage before normalization: ${usage_before}%."
          [[ "$usage_before" =~ ^[0-9]+$ ]]
          if (( usage_before < 85 )); then
            echo 'Capacity gate already satisfied; no filesystem policy change required.'
            exit 0
          fi

          sudo -n true >/dev/null 2>&1
          root_source="$(findmnt -n -o SOURCE /)"
          root_fstype="$(findmnt -n -o FSTYPE /)"
          [[ "$root_fstype" == ext4 ]]
          [[ "$root_source" == /dev/* ]]

          block_count="$(sudo -n tune2fs -l "$root_source" | awk -F: '/^Block count:/ {gsub(/[[:space:]]/,"",$2); print $2; exit}')"
          reserved_blocks="$(sudo -n tune2fs -l "$root_source" | awk -F: '/^Reserved block count:/ {gsub(/[[:space:]]/,"",$2); print $2; exit}')"
          block_size="$(sudo -n tune2fs -l "$root_source" | awk -F: '/^Block size:/ {gsub(/[[:space:]]/,"",$2); print $2; exit}')"
          [[ "$block_count" =~ ^[0-9]+$ && "$reserved_blocks" =~ ^[0-9]+$ && "$block_size" =~ ^[0-9]+$ ]]
          (( block_count > 0 && reserved_blocks > 0 && block_size > 0 ))

          # Preserve a 1.5% root-only reserve. On this 116 GiB staging volume that
          # keeps roughly 1.8 GiB reserved while making ~605 MiB normally available.
          target_reserved="$(( (block_count * 15 + 999) / 1000 ))"
          target_bytes="$(( target_reserved * block_size ))"
          (( target_bytes >= 1610612736 ))
          (( target_reserved < reserved_blocks ))

          echo "Normalizing ext4 root reserve from $reserved_blocks to $target_reserved blocks (1.5% target); no files or project data are deleted."
          sudo -n tune2fs -r "$target_reserved" "$root_source" >/dev/null

          usage_after="$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          echo "Root filesystem usage after normalization: ${usage_after}%."
          [[ "$usage_after" =~ ^[0-9]+$ ]]
          if (( usage_after >= 85 )); then
            echo 'Normalization did not clear the acceptance gate; restoring the original reserve.'
            sudo -n tune2fs -r "$reserved_blocks" "$root_source" >/dev/null
            exit 1
          fi

          sudo -n tune2fs -l "$root_source" | grep -E '^(Block count|Reserved block count|Block size|Reserved blocks uid|Reserved blocks gid):'
          df -hT /
          df -B1 /
          REMOTE
