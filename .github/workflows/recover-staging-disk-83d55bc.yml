name: Recover staging disk and resume 83d55bc

on:
  push:
    branches:
      - ops/recover-staging-disk-83d55bc

permissions:
  actions: write
  contents: read

concurrency:
  group: jalwa-recover-staging-disk-83d55bc
  cancel-in-progress: false

jobs:
  recover-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_SHA: 83d55bc263a9ffeac3957b091b9c0d5ba4a035b3
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      USER: ${{ vars.STAGING_USER || 'codistan' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/codistan/jalwa-platform' }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Verify immutable release and staging SSH
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          test "$main_sha" = "$TARGET_SHA" || { echo "main moved from target: $main_sha" >&2; exit 1; }
          test -n "$HOST" && test -n "$USER" && test -n "$APP_DIR" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jalwa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jalwa ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/jalwa "$USER@$HOST" true

      - name: Reclaim only repository-approved stale Docker storage
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/jalwa "$USER@$HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          before="$(df -P "$APP_DIR" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          [[ "$before" =~ ^[0-9]+$ ]]
          echo "Staging disk before approved cleanup: ${before}%"

          # Matches the repository maintenance policy: only unused image and
          # builder cache objects older than seven days are eligible.
          docker image prune -af --filter 'until=168h'
          docker builder prune -af --filter 'until=168h' || true

          after="$(df -P "$APP_DIR" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          [[ "$after" =~ ^[0-9]+$ ]]
          echo "Staging disk after approved cleanup: ${after}%"
          (( after < 85 )) || { echo "Staging disk remains above release gate after safe cleanup: ${after}%" >&2; exit 1; }

          docker inspect jalwa-postgres-staging >/dev/null
          docker exec jalwa-postgres-staging pg_isready -U postgres -d postgres >/dev/null
          test "$(docker inspect -f '{{.State.Health.Status}}' jalwa-web-staging)" = healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' jalwa-worker-staging)" = healthy
          REMOTE

      - name: Dispatch canonical exact-SHA staging deployment retry
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          before_ids="$(gh api "repos/$REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100" | jq -r '.workflow_runs[] | select(.path == ".github/workflows/deploy-staging.yml") | .id' | tr '\n' ' ')"
          gh api --method POST "repos/$REPO/actions/workflows/deploy-staging.yml/dispatches" -f ref=main
          deploy_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
            while read -r id path event branch; do
              test -n "$id" || continue
              if test "$path" = '.github/workflows/deploy-staging.yml' && test "$event" = workflow_dispatch && test "$branch" = main && ! grep -qw "$id" <<<"$before_ids"; then
                deploy_id="$id"
                break
              fi
            done < <(jq -r '.workflow_runs[] | [.id,.path,.event,.head_branch] | @tsv' <<<"$runs")
            test -n "$deploy_id" && break
            test "$attempt" -lt 90 || { echo 'Could not identify staging retry run.' >&2; exit 1; }
            sleep 10
          done
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Staging retry run: $deploy_id"

      - name: Wait for exact-SHA staging deployment
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            run="$(gh api "repos/$REPO/actions/runs/$DEPLOY_ID")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            if test "$status" = completed; then
              test "$conclusion" = success || { echo "Staging retry failed: $DEPLOY_ID ($conclusion)" >&2; exit 1; }
              echo "Staging retry passed: $DEPLOY_ID"
              exit 0
            fi
            test "$attempt" -lt 240 || { echo 'Timed out waiting for staging retry.' >&2; exit 1; }
            sleep 20
          done

      - name: Wait for automatic staging certification
        id: cert
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          cert_id=''
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
            cert_id="$(jq -r '[.workflow_runs[] | select(.path == ".github/workflows/staging-acceptance.yml" and .event == "workflow_run")][0].id // empty' <<<"$runs")"
            test -n "$cert_id" && break
            test "$attempt" -lt 120 || { echo 'Automatic staging certification did not start.' >&2; exit 1; }
            sleep 10
          done
          echo "cert_id=$cert_id" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 240); do
            run="$(gh api "repos/$REPO/actions/runs/$cert_id")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            if test "$status" = completed; then
              test "$conclusion" = success || { echo "Staging certification failed: $cert_id ($conclusion)" >&2; exit 1; }
              echo "Staging certification passed: $cert_id"
              exit 0
            fi
            test "$attempt" -lt 240 || { echo 'Timed out waiting for staging certification.' >&2; exit 1; }
            sleep 20
          done

      - name: Dispatch payment-service staging preflight
        id: preflight
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          before_ids="$(gh api "repos/$REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100" | jq -r '.workflow_runs[] | select(.path == ".github/workflows/payment-service-staging-preflight.yml") | .id' | tr '\n' ' ')"
          gh api --method POST "repos/$REPO/actions/workflows/payment-service-staging-preflight.yml/dispatches" \
            -f ref=main \
            -f "inputs[release_sha]=$TARGET_SHA" \
            -f "inputs[staging_deployment_run_id]=$DEPLOY_ID"
          preflight_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
            while read -r id path event branch; do
              test -n "$id" || continue
              if test "$path" = '.github/workflows/payment-service-staging-preflight.yml' && test "$event" = workflow_dispatch && test "$branch" = main && ! grep -qw "$id" <<<"$before_ids"; then
                preflight_id="$id"
                break
              fi
            done < <(jq -r '.workflow_runs[] | [.id,.path,.event,.head_branch] | @tsv' <<<"$runs")
            test -n "$preflight_id" && break
            test "$attempt" -lt 90 || { echo 'Could not identify payment-service preflight run.' >&2; exit 1; }
            sleep 10
          done
          echo "preflight_id=$preflight_id" >> "$GITHUB_OUTPUT"
          echo "Payment-service preflight run: $preflight_id"

      - name: Wait for payment-service staging preflight
        shell: bash
        env:
          PREFLIGHT_ID: ${{ steps.preflight.outputs.preflight_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            run="$(gh api "repos/$REPO/actions/runs/$PREFLIGHT_ID")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            if test "$status" = completed; then
              test "$conclusion" = success || { echo "Payment-service preflight did not pass: $PREFLIGHT_ID ($conclusion)" >&2; exit 1; }
              echo "Payment-service preflight passed: $PREFLIGHT_ID"
              exit 0
            fi
            test "$attempt" -lt 180 || { echo 'Timed out waiting for payment-service preflight.' >&2; exit 1; }
            sleep 20
          done

      - name: Record recovered release chain
        if: success()
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          CERT_ID: ${{ steps.cert.outputs.cert_id }}
          PREFLIGHT_ID: ${{ steps.preflight.outputs.preflight_id }}
        run: |
          {
            echo '## Recovered exact-SHA staging release chain'
            echo "- release: $TARGET_SHA"
            echo "- deploy staging retry: $DEPLOY_ID"
            echo "- staging certification: $CERT_ID"
            echo "- payment-service preflight: $PREFLIGHT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
