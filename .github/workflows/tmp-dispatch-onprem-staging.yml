name: Temporary dispatch on-prem staging

on:
  push:
    branches:
      - ops/dispatch-onprem-staging-20260901-2207
    paths:
      - .github/workflows/tmp-dispatch-onprem-staging.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy staging on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml/dispatches \
            -d '{"ref":"main"}'
