name: Bootstrap platform accounts

on:
  workflow_dispatch:
    inputs:
      digitalocean_region:
        description: DigitalOcean region slug
        required: true
        default: blr1
      admin_cidr:
        description: Trusted SSH CIDR, such as 203.0.113.10/32
        required: true
      domain:
        description: Production domain
        required: true
        default: watch-jalwa.com
      droplet_size:
        description: DigitalOcean size; 4 vCPU / 8 GB is recommended for the combined stack
        required: true
        default: s-4vcpu-8gb

permissions:
  contents: read
  actions: write

concurrency:
  group: jalwa-platform-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e

      - name: Validate required account connections
        env:
          SSH_PUBLIC_KEY: ${{ secrets.DIGITALOCEAN_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          for value in DIGITALOCEAN_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SSH_PUBLIC_KEY; do
            test -n "${!value:-}" || { echo "Missing $value" >&2; exit 1; }
          done

      - name: Create Cloudflare R2 buckets
        run: |
          set -euo pipefail
          for bucket in jalwa-terraform-state jalwa-incoming jalwa-media jalwa-rights-evidence jalwa-backups; do
            status=$(curl -sS -o /tmp/r2.json -w '%{http_code}' \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"$bucket\"}")
            if [[ "$status" != "200" && "$status" != "201" && "$status" != "409" ]]; then
              cat /tmp/r2.json >&2
              exit 1
            fi
          done

      - name: Provision DigitalOcean with Terraform
        id: terraform
        env:
          SSH_PUBLIC_KEY: ${{ secrets.DIGITALOCEAN_SSH_PUBLIC_KEY }}
          REGION: ${{ inputs.digitalocean_region }}
          ADMIN_CIDR: ${{ inputs.admin_cidr }}
          DOMAIN: ${{ inputs.domain }}
          DROPLET_SIZE: ${{ inputs.droplet_size }}
        run: |
          set -euo pipefail
          cd infrastructure/digitalocean
          terraform init -reconfigure \
            -backend-config="bucket=jalwa-terraform-state" \
            -backend-config="key=production/digitalocean.tfstate" \
            -backend-config="region=auto" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true" \
            -backend-config="endpoints={s3=\"https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com\"}"
          terraform apply -auto-approve \
            -var="digitalocean_token=$DIGITALOCEAN_TOKEN" \
            -var="region=$REGION" \
            -var="droplet_size=$DROPLET_SIZE" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="admin_cidrs=[\"$ADMIN_CIDR\"]" \
            -var="domain=$DOMAIN"
          host=$(terraform output -raw ipv4_address)
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Capture provisioned SSH host identity
        id: hostkey
        env:
          HOST: ${{ steps.terraform.outputs.host }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if key=$(ssh-keyscan -T 5 -t ed25519 "$HOST" 2>/dev/null) && [[ -n "$key" ]]; then break; fi
            sleep 10
          done
          [[ -n "${key:-}" ]] || { echo 'Could not read the new host Ed25519 key.' >&2; exit 1; }
          printf '%s\n' "$key" > /tmp/production-known-hosts
          fingerprint=$(ssh-keygen -lf /tmp/production-known-hosts | awk '{print $2}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Configure Cloudflare DNS
        env:
          HOST: ${{ steps.terraform.outputs.host }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          upsert_record() {
            local name="$1"
            local existing body
            existing=$(curl -fsS "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=$name" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
            body=$(jq -nc --arg type A --arg name "$name" --arg content "$HOST" '{type:$type,name:$name,content:$content,ttl:1,proxied:true}')
            if [[ -n "$existing" ]]; then
              curl -fsS -X PUT "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$existing" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/dev/null
            else
              curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/dev/null
            fi
          }
          upsert_record "$DOMAIN"
          upsert_record "www.$DOMAIN"
          curl -fsS "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=media.$DOMAIN" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[].id' | while read -r record_id; do
              curl -fsS -X DELETE "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$record_id" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null
            done

      - name: Persist deployment outputs
        env:
          HOST: ${{ steps.terraform.outputs.host }}
          DOMAIN: ${{ inputs.domain }}
          HOST_FINGERPRINT: ${{ steps.hostkey.outputs.fingerprint }}
        run: |
          set -euo pipefail
          gh variable set PRODUCTION_HOST --env production --body "$HOST"
          gh variable set PRODUCTION_USER --env production --body "jalwa"
          gh variable set PRODUCTION_DOMAIN --env production --body "$DOMAIN"
          gh variable set PRODUCTION_SSH_KNOWN_HOSTS --env production --body "$(cat /tmp/production-known-hosts)"
          {
            echo '### Platform bootstrap complete'
            echo "- DigitalOcean host: $HOST"
            echo "- SSH Ed25519 fingerprint: $HOST_FINGERPRINT"
            echo '- R2 buckets and Cloudflare DNS configured'
            echo '- Production SSH host identity pinned for subsequent deploys'
            echo '- Configure PostgreSQL, Better Auth and SMTP production secrets before deployment'
          } >> "$GITHUB_STEP_SUMMARY"
