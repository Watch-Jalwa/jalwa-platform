name: Inspect retained Sintel playlist failure and original credits
on:
  push:
    branches: [ops/retained-media-repair-20261106]
    paths: [.github/workflows/retained-repair-diagnose-20261106.yml, ops/retained-repair-20261106/diagnose.mjs]
permissions:
  contents: read
concurrency:
  group: jalwa-staging
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      RELEASE_SHA: 0c8f09c0a59d0e98d9725c40c7bdffa8a989eb44
      HOST: ${{ vars.STAGING_HOST || 'jalwa-platform.codistan.org' }}
      STAGE_USER: ${{ vars.STAGING_USER || 'codistan' }}
      KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Inspect only this repair's cached outputs and source credits
        run: |
          set -Eeuo pipefail
          source ops/retained-repair-20261106/connection.sh
          mkdir -p evidence
          staging_ssh "docker exec -i -e GITHUB_RUN_ID=$GITHUB_RUN_ID jalwa-worker-staging node --input-type=module -" < ops/retained-repair-20261106/diagnose.mjs | tee evidence/playlist-inspection.log
          staging_ssh "docker exec jalwa-worker-staging tar -czf - -C /tmp/jalwa-retained-inspection-$GITHUB_RUN_ID ." > "$RUNNER_TEMP/credit-frames.tar.gz"
          tar -xzf "$RUNNER_TEMP/credit-frames.tar.gz" -C evidence
      - name: Read retained-film credit frames
        run: |
          [ -e evidence/sintel-credit-001.jpg ] || exit 0
          sudo apt-get -qq update && sudo apt-get -qq install tesseract-ocr >/dev/null
          for frame in evidence/sintel-credit-*.jpg; do
            echo "FRAME ${frame##*/}"
            tesseract "$frame" stdout --psm 11 2>/dev/null
          done | tee evidence/sintel-credits.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
