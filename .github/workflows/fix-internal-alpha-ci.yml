name: Fix internal alpha CI findings

on:
  push:
    branches:
      - agent/internal-alpha-content-platform
    paths:
      - ".github/workflows/fix-internal-alpha-ci.yml"

permissions:
  contents: write

concurrency:
  group: fix-internal-alpha-ci
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/internal-alpha-content-platform
          fetch-depth: 0
          persist-credentials: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Apply targeted repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/202608010006_internal_alpha_content_controls.sql')
          text = migration.read_text()
          old = '''  select i, s into v_item, v_source
          from public.source_items i
          join public.source_accounts s on s.id = i.source_account_id
          where i.id = p_source_item_id
            and i.rights_state = 'validated'
            and i.ingestion_status = 'approved'
            and i.content_id is null
            and s.is_enabled
            and s.copyright_approved
            and s.approved_for_discovery
            and (s.next_review_at is null or s.next_review_at > now())
          for update of i;

          if v_item.id is null then
          '''
          new = '''  select i.* into v_item
          from public.source_items i
          join public.source_accounts s on s.id = i.source_account_id
          where i.id = p_source_item_id
            and i.rights_state = 'validated'
            and i.ingestion_status = 'approved'
            and i.content_id is null
            and s.is_enabled
            and s.copyright_approved
            and s.approved_for_discovery
            and (s.next_review_at is null or s.next_review_at > now())
          for update of i, s;

          if v_item.id is null then
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected source-item promotion query exactly once')
          text = text.replace(old, new)
          anchor = '''  if v_item.id is null then
            raise exception 'approved unimported source item not found';
          end if;

          if p_hosting_mode = 'self_host_open' then
          '''
          replacement = '''  if v_item.id is null then
            raise exception 'approved unimported source item not found';
          end if;

          select s.* into v_source
          from public.source_accounts s
          where s.id = v_item.source_account_id;

          if p_hosting_mode = 'self_host_open' then
          '''
          if text.count(anchor) != 1:
              raise SystemExit('Expected source lookup anchor exactly once')
          migration.write_text(text.replace(anchor, replacement))

          validator = Path('infrastructure/production/scripts/validate-production.sh')
          text = validator.read_text()
          old = "require_match 'bucket(\"processed\")' apps/worker/src/media.mjs 'Processed output bucket is not used by the media worker.'"
          new = "require_match 'R2_PROCESSED_BUCKET' apps/worker/src/storage.mjs 'Processed R2 bucket is not configured in the media storage adapter.'\nrequire_match 'uploadDirectory(output, prefix)' apps/worker/src/media.mjs 'Processed media output is not uploaded by the media worker.'"
          if text.count(old) != 1:
              raise SystemExit('Expected legacy processed-bucket contract exactly once')
          validator.write_text(text.replace(old, new))
          PY
          terraform fmt -recursive infrastructure/aws-media
          terraform fmt -check -recursive infrastructure/aws-media
          node --check apps/worker/src/media.mjs
          node --check apps/worker/src/storage.mjs
          git diff --check

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jalwa-release-bot"
          git config user.email "release-bot@watch-jalwa.com"
          git add supabase/migrations/202608010006_internal_alpha_content_controls.sql \
            infrastructure/aws-media \
            infrastructure/production/scripts/validate-production.sh
          git diff --cached --check
          git commit -m "Fix internal alpha validation findings"
          git push origin HEAD:agent/internal-alpha-content-platform
