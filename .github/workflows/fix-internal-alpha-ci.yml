name: Fix internal alpha CI findings

on:
  push:
    branches:
      - agent/internal-alpha-content-platform
    paths:
      - ".github/workflows/fix-internal-alpha-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-internal-alpha-ci.yml"

permissions:
  contents: write

concurrency:
  group: fix-internal-alpha-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/internal-alpha-content-platform
          fetch-depth: 0
          persist-credentials: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Apply targeted repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/202608010006_internal_alpha_content_controls.sql')
          text = migration.read_text()
          function_start = text.index('create or replace function public.promote_source_item_to_draft(')
          function_end = text.index('create or replace function public.claim_source_download_job', function_start)
          before = text[:function_start]
          function = text[function_start:function_end]
          after = text[function_end:]

          replacements = [
              (
                  '  select i, s into v_item, v_source\n',
                  '  select i.* into v_item\n',
                  'source-item select',
              ),
              (
                  '  for update of i;\n',
                  '  for update of i, s;\n',
                  'source-item lock',
              ),
              (
                  "  end if;\n\n  if p_hosting_mode = 'self_host_open' then\n",
                  "  end if;\n\n"
                  "  select s.* into v_source\n"
                  "  from public.source_accounts s\n"
                  "  where s.id = v_item.source_account_id;\n\n"
                  "  if p_hosting_mode = 'self_host_open' then\n",
                  'source-account lookup',
              ),
          ]
          for old, new, label in replacements:
              if function.count(old) != 1:
                  raise SystemExit(f'Expected {label} exactly once, found {function.count(old)}')
              function = function.replace(old, new, 1)
          migration.write_text(before + function + after)

          validator = Path('infrastructure/production/scripts/validate-production.sh')
          text = validator.read_text()
          old = "require_match 'bucket(\"processed\")' apps/worker/src/media.mjs 'Processed output bucket is not used by the media worker.'"
          new = (
              "require_match 'R2_PROCESSED_BUCKET' apps/worker/src/storage.mjs "
              "'Processed R2 bucket is not configured in the media storage adapter.'\n"
              "require_match 'uploadDirectory(output, prefix)' apps/worker/src/media.mjs "
              "'Processed media output is not uploaded by the media worker.'"
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected legacy processed-bucket contract exactly once, found {text.count(old)}')
          validator.write_text(text.replace(old, new, 1))
          PY
          terraform fmt -recursive infrastructure/aws-media
          terraform fmt -check -recursive infrastructure/aws-media
          node --check apps/worker/src/media.mjs
          node --check apps/worker/src/storage.mjs
          git diff --check

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jalwa-release-bot"
          git config user.email "release-bot@watch-jalwa.com"
          git add supabase/migrations/202608010006_internal_alpha_content_controls.sql \
            infrastructure/aws-media \
            infrastructure/production/scripts/validate-production.sh
          git diff --cached --check
          git commit -m "Fix internal alpha validation findings"
          git push origin HEAD:agent/internal-alpha-content-platform
